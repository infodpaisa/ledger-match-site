<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
</head><body>
<title>Ledger Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F9FAFC; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#E9EDF2; --line-strong:#D6DCE5;
  --ink:#1E2533; --ink-2:#566175; --ink-3:#8993A5;
  --accent:#3558D0; --accent-ink:#FFFFFF; --accent-soft:#EEF2FD;
  --ok:#1A8A57; --ok-soft:#EAF7EF;
  --high:#CF3D35; --high-soft:#FDEEEC;
  --med:#B07614; --med-soft:#FDF5E4;
  --low:#5468B3; --low-soft:#F0F2FA;
  --review:#8457BF; --review-soft:#F5EFFC;
  --bar:#A3AEC8; --acct2:#138579;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#7a5cd6;
  --q1:#86b6ef; --q2:#3987e5; --q3:#1c5cab; --q4:#0d366b;
  --shadow:0 1px 2px rgba(30,37,51,.04),0 4px 14px rgba(30,37,51,.04);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#050505; --surface:#0E0E0F; --surface-2:#151516; --line:#222224; --line-strong:#323235;
  --ink:#ECECEE; --ink-2:#AFAFB5; --ink-3:#7D7D84;
  --accent:#7D98F2; --accent-ink:#050505; --accent-soft:#171C2C;
  --ok:#4FC28A; --ok-soft:#0F1F17; --high:#F07A72; --high-soft:#2A1413;
  --med:#E3AA45; --med-soft:#261D0D; --low:#93A5E8; --low-soft:#161A28;
  --review:#B894EA; --review-soft:#211A2C; --bar:#55555C; --acct2:#4CC3B3;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9b82ea;
  --q1:#184f95; --q2:#256abf; --q3:#3987e5; --q4:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.5);
}
[hidden]{display:none!important}

.mi-wrap:not(:empty){margin-bottom:16px}
.lg-switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 16px}
svg rect.hit:hover{fill:var(--ink);fill-opacity:.05}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);position:relative;flex:none}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--bg)}
.brand-mark::before{top:9px}.brand-mark::after{top:15px;right:10px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;color:var(--ink-3);cursor:default;border:0;background:none;width:100%;text-align:left}
.step .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:11px;font-family:var(--mono);flex:none}
.step.done{color:var(--ink-2);cursor:pointer}
.step.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.active{color:var(--ink);background:var(--accent-soft);font-weight:600}
.step.active .n{border-color:var(--accent);color:var(--accent)}
.step.avail{color:var(--ink-2);cursor:pointer}
.step.avail:hover,.step.done:hover{background:var(--surface-2)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.rail-foot .lock{display:flex;gap:8px;align-items:flex-start}
.main{padding-inline:28px;padding-block:24px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-size:22px;margin:2px 0 0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:15px;margin:0;letter-spacing:-.005em}
h3{font-size:13px;margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}

/* inputs */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.inp,select.inp{height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
textarea.inp{height:auto;padding:8px 10px;font-family:var(--mono);font-size:12px;resize:vertical}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* upload */
.drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:28px 18px;text-align:center;cursor:pointer;background:var(--surface-2);transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.file-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.file-meta div{background:var(--surface);padding:10px 12px;min-width:0}
.file-meta b{display:block;font-family:var(--mono);font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;letter-spacing:.03em;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.t tr:last-child td{border-bottom:0}
.notice{display:flex;gap:10px;padding:10px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.notice.warn{background:var(--med-soft);border-color:transparent;color:var(--ink)}
.notice.err{background:var(--high-soft);border-color:transparent;color:var(--ink)}

/* mapping */
.map-table{width:100%;border-collapse:collapse}
.map-table th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.map-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.map-table td:first-child{width:28%}
.map-sample{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.auto-tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);font-weight:600;margin-left:6px}
.req{color:var(--high);margin-left:2px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.keys{display:flex;flex-direction:column;gap:8px}
.keyrow{display:grid;grid-template-columns:90px minmax(0,1fr) 24px minmax(0,1fr) 28px;gap:8px;align-items:center}
.keyrow .arrow{text-align:center;color:var(--ink-3)}
.lvl{font-family:var(--mono);font-size:11px;padding:3px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);text-align:center}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .lbl{display:block;margin-bottom:6px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:4px}
.kpi.hl .v{color:var(--high)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px;display:flex;gap:2px}
.meter i{display:block;height:100%}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;border-left-width:3px}
.cat:hover{border-color:var(--line-strong)}
.cat .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat .c{font-family:var(--mono);font-size:20px;font-weight:500}
.cat .nm{font-size:12px;color:var(--ink-2);font-weight:500}
.cat .ft{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.cat.sev-HIGH{border-left-color:var(--high)}.cat.sev-MEDIUM{border-left-color:var(--med)}.cat.sev-LOW{border-left-color:var(--low)}.cat.sev-REVIEW{border-left-color:var(--review)}.cat.zero{opacity:.55}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.hbar .track{height:12px;position:relative}
.hbar .fill{height:100%;background:var(--bar);border-radius:0 3px 3px 0;min-width:1px}
.hbar .num{font-size:12px}
.chart-wrap{position:relative}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;z-index:50;white-space:nowrap;box-shadow:var(--shadow)}
.tip b{font-family:var(--mono);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.acct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;font-size:13px}
.acct .num{font-size:13px}
.acct .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}

/* rail groups */
.step-grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 8px 4px}
.steps li:first-child.step-grp{padding-top:0}
/* ledger calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
.cal .dcell{min-height:84px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:7px 8px;display:flex;flex-direction:column;gap:5px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.cal .dcell:hover{border-color:var(--line-strong)}
.cal .dcell.off{background:transparent;border-style:dashed;cursor:default;opacity:.45}
.cal .dcell.sel{outline:2px solid var(--accent);outline-offset:1px}
.cal .dnum{font-family:var(--mono);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.sess{display:flex;gap:4px}
.sess span{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid var(--line-strong);color:var(--ink-3)}
.sess span.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sess span.late{background:var(--high-soft);color:var(--high);border-color:transparent}
.sess span.imp{background:var(--low-soft);color:var(--low);border-color:transparent}
.sess span.skip{background:var(--surface-2);color:var(--ink-3);border-color:transparent;text-decoration:line-through}
.dmeta{font-size:11px;font-family:var(--mono);color:var(--ink-2);line-height:1.35}
.dmeta .bad{color:var(--high)}
.dmeta .good{color:var(--ok);font-weight:500}
.slot{border:1.5px dashed var(--line-strong);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.slot.filled{border-style:solid;background:var(--surface)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.chk .i{flex:none;width:16px;text-align:center;font-weight:700}
.chk.ok .i{color:var(--ok)} .chk.warn .i{color:var(--med)} .chk.bad .i{color:var(--high)}
@media (max-width:700px){.cal{gap:3px}.cal .dcell{min-height:64px;padding:4px}.dmeta{display:none}}
/* accounts */
.acct-box{border-top:3px solid var(--c)}
.acct-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.acct-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.acct-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:4px;white-space:nowrap;line-height:1.5}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-HIGH{background:var(--high-soft);color:var(--high)}
.b-MEDIUM{background:var(--med-soft);color:var(--med)}
.b-LOW{background:var(--low-soft);color:var(--low)}
.b-REVIEW{background:var(--review-soft);color:var(--review)}
.b-none{background:var(--surface-2);color:var(--ink-3)}
.tag{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.st{font-family:var(--mono);font-size:11.5px}
.st small{color:var(--ink-3)}

/* results table */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 12px;height:30px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.res-wrap{max-height:620px;overflow:auto}
table.res td{cursor:pointer}
table.res tbody tr:hover td{background:var(--surface-2)}
table.res tr.is-ok td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
table.res tr.sev-HIGH td:first-child{box-shadow:inset 3px 0 0 var(--high)}
table.res tr.sev-MEDIUM td:first-child{box-shadow:inset 3px 0 0 var(--med)}
table.res tr.sev-LOW td:first-child{box-shadow:inset 3px 0 0 var(--low)}
table.res th.sortable{cursor:pointer;user-select:none}
table.res th.sortable:hover{color:var(--ink)}
table.res th .arr{font-family:var(--mono);color:var(--accent)}
.neg{color:var(--high)}.pos{color:var(--ok)}
.empty-cell{color:var(--ink-3)}
.pager{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.36);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-b{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600}
.cmp td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.cmp td:first-child{font-family:var(--sans);color:var(--ink-2);font-size:12.5px;width:120px;word-break:normal}
.cmp tr.diff td{background:var(--high-soft)}
.cmp tr.diff td:first-child{box-shadow:inset 3px 0 0 var(--high);color:var(--ink);font-weight:600}
.cmp .dcol{color:var(--ink-3)}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.callout .lbl{display:block;margin-bottom:6px}
.callout .line{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:13px}
.callout .line span:first-child{font-family:var(--sans);color:var(--ink-3);font-size:12px}
details.raw summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:13px}

/* AI */
.ai-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ai-sec h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.ai-item{padding:10px 0;border-top:1px solid var(--line)}
.ai-item:first-of-type{border-top:0;padding-top:0}
.ai-item b{display:block;font-size:13.5px;margin-bottom:3px}
.ai-item p{color:var(--ink-2);font-size:13px;max-width:70ch}
.ai-item .ev{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:4px}
.kind{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px}
.k-fact{background:var(--ok-soft);color:var(--ok)}.k-hyp{background:var(--med-soft);color:var(--med)}.k-inv{background:var(--low-soft);color:var(--low)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script>
/* ============ hosted mode (GitHub Pages): Supabase stands in for the Claude artifact runtime ============ */
/* Only in the site build. Provides window.claude.use('db'|'assets'|'downloads'|'sample') with the same shapes the
   artifact runtime gives, so the rest of the app is unchanged. AI analysis ('sample') is off in hosted mode. */
(()=>{
if(window.claude) return;
window.LM_HOSTED=true;
const SB_URL='https://anblniwzohhruwobaorw.supabase.co', SB_KEY='sb_publishable_5eZVVUkA0-Drra99uCXCkA_oZ2S-YvV';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const BUCKET='blobs', MAX_BYTES=1024*1048576, MAX_FILES=10000;
let ready; const READY=new Promise(r=>ready=r);   // resolves once a signed-in member is confirmed
const fail=(e,code)=>{ const x=new Error((e&&e.message)||String(e)); x.code=code||(e&&e.code)||'error'; return x };
const plain=d=>JSON.parse(JSON.stringify(d));

/* ---- db: collection(c).orderBy(f,dir).limit(n).onSnapshot / doc(id).set|update|delete|get ---- */
const cache={}, listeners={};   // collection -> Map(id -> data); collection -> Set(fire)
const fireAll=c=>(listeners[c]||[]).forEach(f=>f());
const patch=(c,id,d)=>{ if(!cache[c]) return; if(d===null) cache[c].delete(id); else cache[c].set(id,d); fireAll(c) };
async function loadColl(c){
  const m=new Map(); const step=1000;
  for(let from=0;;from+=step){
    const {data,error}=await sb.from('docs').select('id,data').eq('collection',c).range(from,from+step-1);
    if(error) throw fail(error); data.forEach(r=>m.set(r.id,r.data)); if(data.length<step) break;
  }
  cache[c]=m;
}
async function refetchOne(c,id){
  const {data,error}=await sb.from('docs').select('data').eq('collection',c).eq('id',id).maybeSingle();
  if(!error) patch(c,id,data?data.data:null);
}
let channel=null;
function watch(){
  if(channel) return;
  channel=sb.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.new&&p.new.collection?p.new:p.old; if(!r||!cache[r.collection]) return;
    if(p.eventType==='DELETE') patch(r.collection,r.id,null); else refetchOne(r.collection,r.id);
  }).subscribe();
}
const docRef=(c,id)=>({id,
  async set(d){ d=plain(d); const {error}=await sb.from('docs').upsert({collection:c,id,data:d,updated_at:new Date().toISOString()}); if(error) throw fail(error); patch(c,id,d) },
  async update(p){ p=plain(p); const {error}=await sb.rpc('doc_merge',{c,i:id,patch:p}); if(error) throw fail(error,error.code==='P0002'?'not_found':undefined);
    if(cache[c]&&cache[c].has(id)) patch(c,id,{...cache[c].get(id),...p}) },
  async delete(){ const {error}=await sb.from('docs').delete().eq('collection',c).eq('id',id); if(error) throw fail(error); patch(c,id,null) },
  async get(){ const {data,error}=await sb.from('docs').select('data').eq('collection',c).eq('id',id).maybeSingle(); if(error) throw fail(error);
    return {id,exists:!!data,data:()=>data?data.data:undefined} }});
const coll=c=>{ const q={_o:null,_n:Infinity,
  orderBy(f,dir){ q._o=[f,dir]; return q }, limit(n){ q._n=n; return q }, doc(id){ return docRef(c,id||crypto.randomUUID()) },
  onSnapshot(next,error){
    let live=true;
    const fire=()=>{ if(!live||!cache[c]) return;
      let docs=[...cache[c]].map(([id,d])=>({id,exists:true,data:()=>d}));
      if(q._o){ const [f,dir]=q._o, s=dir==='desc'?-1:1; docs.sort((a,b)=>{ const x=a.data()[f], y=b.data()[f]; return x===y?0:(x<y?-1:1)*s }) }
      docs=docs.slice(0,q._n); next({docs,size:docs.length,empty:!docs.length}) };
    (listeners[c]||(listeners[c]=new Set())).add(fire);
    (cache[c]?Promise.resolve():loadColl(c)).then(()=>{ watch(); fire() },e=>error&&error(fail(e)));
    return ()=>{ live=false; listeners[c].delete(fire) };
  }}; return q };

/* ---- assets: upload / list / delete, read back through fetch('/_blob/<id>') ---- */
const objName=id=>id+'.json';
const assets={
  async upload(blob){ const id=crypto.randomUUID();
    const {error}=await sb.storage.from(BUCKET).upload(objName(id),blob,{contentType:'application/json'});
    if(error) throw fail(error,String(error.statusCode)==='413'?'too_large':undefined);
    return {id,url:'/_blob/'+id,sizeBytes:blob.size,contentType:'application/json'} },
  async list(){ let files=0, bytes=0;
    for(let off=0;;off+=1000){ const {data,error}=await sb.storage.from(BUCKET).list('',{limit:1000,offset:off}); if(error) throw fail(error);
      data.forEach(o=>{ files++; bytes+=(o.metadata&&o.metadata.size)||0 }); if(data.length<1000) break }
    return {assets:[],usage:{files,bytes,maxFiles:MAX_FILES,maxBytes:MAX_BYTES}} },
  async delete(id){ const {data,error}=await sb.storage.from(BUCKET).remove([objName(id)]); if(error) throw fail(error); return {deleted:!!(data&&data.length)} }};
const rawFetch=window.fetch.bind(window);
window.fetch=async(u,...a)=>{
  if(typeof u==='string'&&u.startsWith('/_blob/')){
    const {data,error}=await sb.storage.from(BUCKET).download(objName(u.slice(7)));
    return error? new Response('',{status:(error.statusCode&&+error.statusCode)||404}) : new Response(data,{status:200,headers:{'content-type':'application/json'}});
  }
  return rawFetch(u,...a);
};

window.claude={ use: async n=>{

st.textContent=`.auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:var(--bg)}

const box=document.createElement('div'); box.className='auth'; document.body.appendChild(box);
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='signin';
function form(msg,kind){
  const T={signin:['Sign in','Sign in'],signup:['Create account','Create account'],reset:['Reset password','Send reset link'],newpw:['Choose a new password','Save password']}[mode];
  box.hidden=false;
  box.innerHTML=`<form class="card" novalidate><div><h1>Ledger Match</h1><p>${T[0]}</p></div>
    ${mode!=='newpw'?'<label>Email<input type="email" name="email" autocomplete="email" required></label>':''}
    ${mode!=='reset'?`<label>Password<input type="password" name="pw" autocomplete="${mode==='signin'?'current-password':'new-password'}" required minlength="8"></label>`:''}
    <button class="btn primary" type="submit">${T[1]}</button>
    <div class="msg ${kind||''}" role="status">${msg?escH(msg):''}</div>
    ${mode==='newpw'?'':`<div class="links">${mode==='signin'?'<button type="button" data-m="signup">Create account</button><button type="button" data-m="reset">Forgot password?</button>':'<button type="button" data-m="signin">Back to sign in</button>'}</div>`}</form>`;
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; form() });
  const f=box.querySelector('form'); (f.querySelector('input')||f).focus();
  f.onsubmit=async ev=>{ ev.preventDefault(); const email=(f.email&&f.email.value.trim())||'', pw=(f.pw&&f.pw.value)||'';
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true; const say=(m,k)=>{ const e=f.querySelector('.msg'); e.className='msg '+(k||''); e.textContent=m };
    try{
      if(mode==='signin'){ const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error }
      else if(mode==='signup'){ if(pw.length<8) throw new Error('Use at least 8 characters.');
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
        if(!data.session){ mode='signin'; form('Check your email to confirm the account, then sign in.','ok'); return } }
      else if(mode==='reset'){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) throw error;
        mode='signin'; form('If that email has an account, a reset link is on its way.','ok'); return }
      else if(mode==='newpw'){ if(pw.length<8) throw new Error('Use at least 8 characters.'); const {error}=await sb.auth.updateUser({password:pw}); if(error) throw error;
        mode='signin'; const {data}=await sb.auth.getSession(); return enter(data.session) }
    }catch(e){ say((e&&e.message)||'Something went wrong.','err'); btn.disabled=false }
  };
}
let entered=false, entering=false;
async function enter(session){
  if(!session||entered||entering) return;
  entering=true; try{ await admit(session) } finally{ entering=false }
}
async function admit(session){
  const {data:ok,error}=await sb.rpc('is_member');
  if(error||!ok){
    box.hidden=false;
    box.innerHTML=`<div class="card"><div><h1>Ledger Match</h1><p>${error?'Could not check access. Try again shortly.':`<b>${escH(session.user.email)}</b> isn’t on the access list yet. Ask an admin to add this email, then sign in again.`}</p></div><button class="btn" id="authOut">Sign out</button></div>`;
    box.querySelector('#authOut').onclick=()=>sb.auth.signOut();
    return;
  }
  entered=true; box.hidden=true;
  const lock=document.querySelector('.rail-foot .lock'); if(lock){ const t=lock.querySelector('span'); if(t) t.textContent='Matching runs in this browser. Saved work is stored in the team database, visible only to approved members.' }
  const foot=document.querySelector('.rail-foot');
  if(foot){ const w=document.createElement('div'); w.className='who'; w.innerHTML=`<span title="${escH(session.user.email)}">${escH(session.user.email)}</span><button type="button" id="authSignOut">Sign out</button>`;
    w.querySelector('#authSignOut').onclick=()=>sb.auth.signOut(); foot.prepend(w);
    const imp=document.createElement('div'); imp.className='who'; imp.innerHTML='<button type="button" id="importBackup">Import backup…</button><input type="file" id="importFile" accept=".json,.gz,application/json,application/gzip" hidden>';
    imp.querySelector('#importBackup').onclick=()=>imp.querySelector('#importFile').click();
    imp.querySelector('#importFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importBackup(f) };
    w.after(imp) }
  ready();
}

/* ---- import a backup file (records exported from the Claude artifact): {v:1, collections:{name:{id:data}}} ---- */
const IMPORT_COLLS=['comparisons','days','cases','profiles'];
async function readBackup(file){
  let stream=file.stream();
  const head=new Uint8Array(await file.slice(0,2).arrayBuffer());
  if(head[0]===0x1f&&head[1]===0x8b) stream=stream.pipeThrough(new DecompressionStream('gzip'));
  const j=JSON.parse(await new Response(stream).text());
  if(!j||j.v!==1||typeof j.collections!=='object') throw new Error('This isn’t a Ledger Match backup file.');
  return j;
}
async function importBackup(file){
  const say=(t,sub)=>window.overlay?overlay(true,t,sub):null;
  try{
    say('Reading backup',file.name);
    const j=await readBackup(file);
    const rows=[]; for(const c of IMPORT_COLLS) for(const [id,data] of Object.entries(j.collections[c]||{})) rows.push({collection:c,id,data});
    if(!rows.length) throw new Error('The backup has no records.');
    const counts=IMPORT_COLLS.map(c=>[c,Object.keys(j.collections[c]||{}).length]).filter(x=>x[1]).map(x=>`${x[1]} ${x[0]}`).join(', ');
    if(window.overlay) overlay(false);
    if(!confirm(`Import ${counts}?\n\nRecords with the same name already in the database will be replaced.`)) return;
    let batch=[], size=0, done=0; const now=new Date().toISOString();
    const flush=async()=>{ if(!batch.length) return; const {error}=await sb.from('docs').upsert(batch); if(error) throw fail(error); done+=batch.length; batch=[]; size=0; say('Importing records',`${done} of ${rows.length}`) };
    say('Importing records',`0 of ${rows.length}`);
    for(const r of rows){ const n=JSON.stringify(r.data).length; if(size+n>1500000) await flush(); batch.push({...r,updated_at:now}); size+=n }
    await flush();
    say('Import finished',`${rows.length} records — reloading`);
    setTimeout(()=>location.reload(),800);
  }catch(e){ if(window.overlay) overlay(false); alert('Import failed: '+((e&&e.message)||e)) }
}
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){ mode='newpw'; form(); return }
  if(ev==='SIGNED_OUT'){ if(entered) location.reload(); else { mode='signin'; form() } return }
  if(ev==='SIGNED_IN'&&mode!=='newpw') setTimeout(()=>enter(session),0);
});
sb.auth.getSession().then(({data})=>{ if(mode==='newpw') return; if(data.session) enter(data.session); else form() });
})();

/* When every date in one file could be read either way (e.g. only days 1–12), pick the reading

function settleAmbiguousDates(A,B,f){
  if(!A.ambiguous || B.ambiguous || B.recs.every(r=>r.ts===null)) return A.order;
  const days=new Set(); for(const r of B.recs) if(r.ts!==null) days.add(Math.floor(r.ts/86400000));
  const score=o=>{ let n=0; for(let i=0;i<f.rows.length;i+=Math.max(1,Math.floor(f.rows.length/20000))){ const t=parseTs(f.rows[i][A.tsCol],o); if(t!==null && days.has(Math.floor((t+A.shift)/86400000))) n++ } return n };

  if(best!==A.order){ for(const r of A.recs){ const t=parseTs(r.tsRaw,best); r.ts = t===null? null : t+A.shift } A.order=best }

}

function fmtDur(s){ const a=Math.abs(s), sg=s<0?'-':'+'; if(a<120) return sg+a.toFixed(a%1?1:0)+'s'; if(a<7200) return sg+(a/60).toFixed(1)+' min'; if(a<172800) return sg+(a/3600).toFixed(1)+' h'; return sg+(a/86400).toFixed(1)+' d' }

/* aggregations used by dashboard + AI analysis */
function aggregate(res){
  const L=res.lines;
  let tmin=Infinity,tmax=-Infinity; for(const l of L){ if(l.ts!==null){ if(l.ts<tmin)tmin=l.ts; if(l.ts>tmax)tmax=l.ts } }

  const time=new Map();

  for(const l of L){
    if(unit && l.ts!==null){ const k=Math.floor(l.ts/unit)*unit; let t=time.get(k); if(!t){t={t:k,total:0,disc:0,high:0,cats:{}};time.set(k,t)} t.total++; if(l.disc){t.disc++; t.cats[l.primary]=(t.cats[l.primary]||0)+1} if(l.sev==='HIGH')t.high++ }

    m.total++; if(l.disc){m.disc++; m.cats[l.primary]=(m.cats[l.primary]||0)+1} if(l.sev==='HIGH')m.high++;

async function loadFile(side,file,demo){
  overlay(true,'Reading '+file.name,'Parsing locally in this browser');

  try{
    const f=await readFile(file); f.demo=!!demo; f.headerRow=guessHeaderRow(f.raw); buildTable(f);
    if(!f.rows.length) throw new Error(`No data rows were found in ${file.name}. Check that the first sheet holds the transactions and that the header row is correct.`);
    S.files[side]=f; afterLoad(side);
    S.result=null; S.ai=null; S.saved=null; S.saveState=''; S.ledgerCtx=null;

}
function afterLoad(side){
  const f=S.files[side]; const sig=side+':'+f.headers.join('|');

  const remembered=ssGet('lm-map-'+sig);
  S.map[side]= remembered || {...S.auto[side]};
  f.sig=sig; S.keys=null; S.diag=null; S.keysAuto=''; S.keysAutoDone=false;
}

function mapSelect(side,k){
  const f=S.files[side], v=S.map[side][k];

}
function mapSample(side,k){
  const f=S.files[side], v=S.map[side][k]; if(v===undefined||v==='') return '';
  const vals=[]; for(let i=0;i<f.rows.length && vals.length<3;i++){const x=f.rows[i][v]; if(!isBlank(x)) vals.push(x)}
  const auto = String(S.auto[side][k])===String(v);
  return `<div class="map-sample" title="${esc(vals.join(' · '))}">${auto?'<span class="auto-tag" style="margin:0 6px 0 0">Auto</span>':''}${esc(vals.join(' · ')||'(empty)')}</div>`;
}
function validateMap(){
  const errs=[], warns=[]; const mi=S.map.internal, mp=S.map.provider, has=(m,k)=>m[k]!==undefined&&m[k]!=='';
  if(!has(mi,'amount')||!has(mp,'amount')) errs.push('Map the Amount column in both files — amounts are required for reconciliation.');
  const usable=(S.keys||[]).filter(k=>has(mi,k.i)&&has(mp,k.p));
  if(!usable.length && !(has(mi,'ts')&&has(mp,'ts'))) errs.push('Add at least one identifier matching key, or map Transaction Timestamp in both files so composite matching can run.');
  if(!has(mi,'status')||!has(mp,'status')) warns.push('Status is not mapped in both files, so status mismatches cannot be detected.');
  if(!has(mi,'ts')||!has(mp,'ts')) warns.push('Timestamp is not mapped in both files, so composite (level 3) matching is off.');
  if(!has(mi,'currency')||!has(mp,'currency')) warns.push('Currency is not mapped in both files; currency mismatches will not be checked and composite matching ignores currency.');
  (S.keys||[]).forEach(k=>{ if(!has(mi,k.i)||!has(mp,k.p)) warns.push(`Matching key “${FIELD[k.i].label} ↔ ${FIELD[k.p].label}” is skipped because a column is not mapped.`) });
  return {errs,warns};
}

/* ============ ID match diagnostics (content-based) ============ */
const ID_FIELDS=['txnId','provTxnId','merchantRef','orderId'];
function idCandidates(side){
  const f=S.files[side], m=S.map[side];
  const excl=new Set(['amount','ts','currency','status','fee','settle'].map(k=>m[k]).filter(v=>v!==undefined&&v!=='').map(Number));
  const out=[];
  f.headers.forEach((h,ci)=>{
    if(excl.has(ci)) return;
    const vals=[]; for(const r of f.rows){ const v=r[ci]; if(!isBlank(v)) vals.push(String(v)) }
    if(vals.length < f.rows.length*0.2 || vals.length<3) return;
    const smp=vals.slice(0,3000), distinct=new Set(smp).size;
    if(distinct/smp.length<0.3) return;
    const dateLike=smp.filter(v=>/\d{1,4}[\-\/.]\d{1,2}[\-\/.]\d{1,4}/.test(v)&&/:/.test(v)).length;
    const amtLike=smp.filter(v=>/^-?[\d,]*\.\d{1,2}$/.test(v.trim())).length;
    if(dateLike>smp.length*0.8||amtLike>smp.length*0.8) return;
    out.push({ci,name:h,vals,sci:vals.filter(v=>SCI_RE.test(v)).length});
  });
  return out;
}
function computeDiag(){
  const nonId=m=>JSON.stringify(['amount','ts','currency','status','fee','settle'].map(k=>m[k])); const sig=S.files.internal.sig+'||'+S.files.provider.sig+'||'+nonId(S.map.internal)+nonId(S.map.provider);
  if(S.diag && S.diag.sig===sig) return S.diag;
  const I=idCandidates('internal'), P=idCandidates('provider'), levels=Object.keys(ID_LEVELS);
  const pSets=P.map(p=>Object.fromEntries(levels.map(L=>[L,new Set(p.vals.map(v=>normId(v,L)).filter(Boolean))])));
  const pairs=[];
  I.forEach(ic=>{
    const uniq=[...new Set(ic.vals)].slice(0,5000);
    const norm=Object.fromEntries(levels.map(L=>[L,uniq.map(v=>normId(v,L)).filter(Boolean)]));
    P.forEach((pc,pj)=>{
      const ov={}; levels.forEach(L=>{ const a=norm[L]; let hit=0; for(const v of a) if(pSets[pj][L].has(v)) hit++; ov[L]=a.length? hit/a.length*100 : 0 });
      pairs.push({ci:ic.ci, cp:pc.ci, iname:ic.name, pname:pc.name, ov});
    });
  });
  S.diag={sig, I, P, pairs};
  return S.diag;
}
function pairOverlap(ci,cp){ const d=S.diag; return d && d.pairs.find(x=>x.ci===ci&&x.cp===cp) }
function ovBadge(v){ const cls=v>=80?'b-ok':v>=20?'b-MEDIUM':'b-HIGH'; return `<span class="badge ${cls}">${v.toFixed(1)}% overlap</span>` }
function drawDiag(){
  const body=$('#diagBody'); if(!body) return;
  let d; try{ d=computeDiag() }catch(e){ console.error(e); body.innerHTML='<p class="faint">Could not compare ID columns.</p>'; return }
  const L=S.cfg.idNorm||'standard', mi=S.map.internal, mp=S.map.provider;
  const has=(m,k)=>m[k]!==undefined&&m[k]!=='';
  const keyRows=(S.keys||[]).map((k,idx)=>({k,idx})).filter(({k})=>has(mi,k.i)&&has(mp,k.p)).map(({k,idx})=>{
    const ci=+mi[k.i], cp=+mp[k.p], x=pairOverlap(ci,cp);
    const fi=S.files.internal, fp=S.files.provider;
    const sample=(f,c)=>{const o=[]; for(const r of f.rows){ if(!isBlank(r[c])) o.push(String(r[c])); if(o.length>=3) break } return o};
    const si=sample(fi,ci), sp=sample(fp,cp);
    return {k,idx,ci,cp,x,si,sp,L:k.fmt||L};
  });
  const configured=new Set(keyRows.map(r=>r.ci+':'+r.cp));
  const best=[...d.pairs].map(p=>({...p,bestL:Object.keys(p.ov).reduce((a,b)=>p.ov[b]>p.ov[a]+0.5?b:a,'exact')})).sort((a,b)=>b.ov[b.bestL]-a.ov[a.bestL]);
  const sugg=best.filter(p=>p.ov[p.bestL]>=10 && !configured.has(p.ci+':'+p.cp)).slice(0,4);
  const levelTip='';
  const sciCols=[...d.I.map(c=>({...c,side:'Internal'})),...d.P.map(c=>({...c,side:'Provider'}))].filter(c=>c.sci>0);
  body.innerHTML=`<div class="stack" style="gap:14px">
    <div class="row" style="align-items:flex-end"><div class="field" style="width:220px"><label for="c-idn">Default ID format</label><select class="inp" id="c-idn">${Object.entries(ID_LEVELS).map(([k,v])=>`<option value="${k}" ${L===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
      <p class="faint" style="font-size:12.5px;flex:1;min-width:220px;padding-bottom:6px">${ID_LEVELS[L].desc}. Each key below can use its own format. Only the comparison changes — original IDs are kept and exported as-is.</p></div>
    ${S.keysAuto?`<div class="notice"><span>${esc(S.keysAuto)}</span></div>`:''}
    ${levelTip}
    ${keyRows.length? `<div class="scroll-x"><table class="t"><thead><tr><th>Matching key</th><th>Format</th><th>Overlap</th><th>Internal sample → compared as</th><th>Provider sample → compared as</th></tr></thead><tbody>
      ${keyRows.map(r=>`<tr><td style="white-space:normal"><b>L${r.k.lvl}</b> ${esc(S.files.internal.headers[r.ci])} ↔ ${esc(S.files.provider.headers[r.cp])}</td>
        <td><select class="inp" data-kfmt="${r.idx}" id="kfmt-${r.idx}" style="height:28px;width:130px" aria-label="ID format for this key">${Object.entries(ID_LEVELS).map(([lk,lv])=>`<option value="${lk}" ${r.L===lk?'selected':''}>${lv.label}</option>`).join('')}</select></td>
        <td>${r.x?ovBadge(r.x.ov[r.L]):'<span class="faint">n/a</span>'}${r.x?`<div class="faint mono" style="font-size:11px;margin-top:3px">${Object.keys(ID_LEVELS).map(l=>`${ID_LEVELS[l].label} ${r.x.ov[l].toFixed(0)}%`).join(' · ')}</div>`:''}</td>
        <td class="mono" style="font-size:11.5px">${r.si.map(v=>`${esc(v)} → <b>${esc(normId(v,r.L))}</b>`).join('<br>')}</td>
        <td class="mono" style="font-size:11.5px">${r.sp.map(v=>`${esc(v)} → <b>${esc(normId(v,r.L))}</b>`).join('<br>')}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="notice warn">No identifier key has a mapped column on both sides yet.</div>'}
    ${keyRows.some(r=>r.x&&Math.max(...Object.values(r.x.ov))<5)?'<div class="notice err">At least one key shares almost no values between the two files, in any format. Those columns probably hold different kinds of IDs — use a suggested pairing below or change the key.</div>':''}
    ${sugg.length?`<div><span class="lbl">Columns whose values actually overlap</span><div class="stack" style="gap:6px;margin-top:8px">${sugg.map(p=>`<div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:8px 10px"><span class="mono" style="font-size:12.5px">Internal “${esc(p.iname)}” ↔ Provider “${esc(p.pname)}”</span><span class="row" style="gap:8px">${ovBadge(p.ov[p.bestL])}<span class="faint" style="font-size:12px">${ID_LEVELS[p.bestL].label}</span><button class="btn sm" data-sugg="${p.ci}:${p.cp}:${p.bestL}">Use as matching key</button></span></div>`).join('')}</div></div>`:(d.pairs.length?'':'<p class="faint">No ID-like columns found to compare.</p>')}
    ${sciCols.map(c=>`<div class="notice err">${c.side} column “${esc(c.name)}” has ${fmtInt(c.sci)} value${c.sci>1?'s':''} in scientific notation (e.g. 1.23457E+15). Excel rounded these IDs, so they can’t match exactly. Re-export the file with that column formatted as text.</div>`).join('')}
  </div>`;
  $('#c-idn').onchange=()=>{S.cfg.idNorm=$('#c-idn').value; S.keysAuto=''; drawDiag()};
  body.querySelectorAll('[data-kfmt]').forEach(sel=>sel.onchange=()=>{S.keys[+sel.dataset.kfmt].fmt=sel.value; drawDiag()});
  body.querySelectorAll('[data-setlvl]').forEach(b=>b.onclick=()=>{S.cfg.idNorm=b.dataset.setlvl; S.keysAuto=''; drawDiag()});
  body.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=()=>{const [ci,cp,l]=b.dataset.sugg.split(':'); applySuggestion(+ci,+cp,l); renderKeep()});
  // first visit: if the default keys barely overlap but another pairing clearly does, switch automatically and say so
  if(!S.keys._edited && !S.keysAutoDone){
    S.keysAutoDone=true;
    const curBest=keyRows.length? Math.max(...keyRows.map(r=>r.x?Math.max(...Object.values(r.x.ov)):0)) : 0;
    const top=best[0];
    if(curBest<20 && top && top.ov[top.bestL]>=50){
      applySuggestion(top.ci,top.cp,top.bestL,true);
      const dead=new Set(keyRows.filter(r=>r.x&&Math.max(...Object.values(r.x.ov))<1).map(r=>r.k)); S.keys=Object.assign(S.keys.filter(k=>!dead.has(k)),{_edited:false});
      S.keysAuto=`The suggested keys shared only ${curBest.toFixed(1)}% of values, so matching now uses Internal “${top.iname}” ↔ Provider “${top.pname}” (${top.ov[top.bestL].toFixed(1)}% overlap, ${ID_LEVELS[top.bestL].label} format). Change it below if that’s wrong.`;
      renderKeep();
    } else {
      // give each key the ID format that lines up the most values
      const changed=[];
      keyRows.forEach(r=>{ if(!r.x) return; const cur=r.x.ov[r.L];
        const bestL=Object.keys(ID_LEVELS).reduce((a,b)=>r.x.ov[b]>r.x.ov[a]+0.5?b:a,'exact');
        if(bestL!==r.L && r.x.ov[bestL]>=cur+10){ S.keys[r.idx].fmt=bestL; changed.push(`${S.files.internal.headers[r.ci]} ↔ ${S.files.provider.headers[r.cp]}: ${ID_LEVELS[bestL].label} (${cur.toFixed(0)}% → ${r.x.ov[bestL].toFixed(0)}%)`) } });
      if(changed.length){ S.keysAuto='ID format adjusted to line up more values — '+changed.join('; ')+'.'; drawDiag() }
    }
  }
}
function applySuggestion(ci,cp,level,auto){
  const pickField=(side,col)=>{
    const m=S.map[side];
    const already=ID_FIELDS.find(k=>String(m[k])===String(col)); if(already) return already;
    const free=['merchantRef','orderId','provTxnId','txnId'].find(k=>m[k]===undefined||m[k]==='');
    const k=free||'merchantRef'; m[k]=col; ssSet('lm-map-'+S.files[side].sig,m); return k;
  };
  const fi=pickField('internal',ci), fp=pickField('provider',cp);
  const ov=(pairOverlap(ci,cp)||{ov:{}}).ov[level]||0;
  const keys=(S.keys||[]).filter(k=>!(k.i===fi&&k.p===fp));
  keys.unshift({lvl: ov>=80?1:2, i:fi, p:fp, fmt:level});
  keys.forEach((k,j)=>{ if(j>0 && k.lvl<keys[0].lvl) k.lvl=keys[0].lvl });
  S.keys=keys; S.keys._edited=!auto;
}

const DASH_CATS = [

  {k:'CURRENCY_MISMATCH', sev:'HIGH'},{k:'DATA_QUALITY_ISSUE', sev:'LOW'}

function impactStr(imp){
  const e=Object.entries(imp).sort((a,b)=>b[1]-a[1]);
  if(!e.length) return {main:'0.00',rest:'No exposure detected'};
  return {main:(e[0][0]&&e[0][0]!=='—'?e[0][0]+' ':'')+microToStr(e[0][1],2), rest: e.length>1? e.slice(1).map(([c,v])=>`${c} ${microToStr(v,2)}`).join(' · ') : 'Sum of per-line exposure'};
}
function catLines(k){ const L=S.result.lines; if(k==='DUP') return L.filter(l=>l.primary==='DUPLICATE_INTERNAL'||l.primary==='DUPLICATE_PROVIDER'); return L.filter(l=>l.primary===k) }
function renderDash(m){
  const r=S.result, st=r.stats, imp=impactStr(st.impact);
  const matchRate=pct(st.matched,st.lines), pairRate=pct(st.acctI.clean+st.acctI.discPair,st.nI);
  const cc = {}; DASH_CATS.forEach(d=>{ const ls=catLines(d.k); let ex={}; ls.forEach(l=>{if(l.exposure){const c=l.cur||'—';ex[c]=(ex[c]||0)+l.exposure}}); cc[d.k]={n:ls.length,ex,high:ls.filter(l=>l.sev==='HIGH').length} });

  ${st.ignoredLines?`<div class="notice" style="align-items:center"><span style="flex:1"><b>${fmtInt(st.ignoredLines)}</b> line${st.ignoredLines>1?'s have':' has'} checks ignored by your severity rules (${Object.entries(st.ignoredCounts).map(([k,v])=>`${esc((RULES.find(r=>r.code===k)||{label:k}).label)}: ${fmtInt(v)}`).join(' · ')}). ${fmtInt(st.clearedByIgnore)} of them no longer count as discrepancies.</span><button class="btn sm" id="viewIgnored">View ignored</button></div>`:''}
  <div class="kpis">

    <div class="kpi"><span class="lbl">Match rate</span><div class="v">${matchRate.toFixed(1)}%</div><div class="s">clean lines · ${pairRate.toFixed(1)}% of internal paired</div></div>

function acctBlock(name,n,a,blank){
  const sum=a.clean+a.discPair+a.only+a.dup;
  return `<div class="acct"><span><b>${name}</b> rows read</span><span class="num"><b>${fmtInt(n)}</b></span>
    <span class="muted">Clean match</span><span class="num">${fmtInt(a.clean)}</span>
    <span class="muted">Paired, with discrepancy</span><span class="num">${fmtInt(a.discPair)}</span>
    <span class="muted">Unmatched (${name.toLowerCase()} only / data quality)</span><span class="num">${fmtInt(a.only)}</span>
    <span class="muted">Duplicate extra rows</span><span class="num">${fmtInt(a.dup)}</span>

function drawTime(){
  const el=$('#timeChart'); if(!el) return;
  const unit=(S.tunit||(S.result.agg.unit===3600000?'h':'d'))==='h'?3600000:86400000;
  const data= unit===S.result.agg.unit ? S.result.agg.time : (S.result['_tb'+unit] || (S.result['_tb'+unit]=bucketLines(S.result.lines,unit)));
  if(!data.length){ el.innerHTML='<p class="faint" style="padding:40px 0;text-align:center">No readable timestamps to chart.</p>'; return }
  const W=el.clientWidth||600, H=220, ml=44, mr=8, mt=10, mb=26, iw=W-ml-mr, ih=H-mt-mb;
  const max=Math.max(1,...data.map(d=>d.total));
  const step=niceStep(max/4), top=Math.ceil(max/step)*step;
  const y=v=>mt+ih-(v/top)*ih, bw=iw/data.length, gap=Math.min(2,bw*.2), w=Math.max(1,bw-gap);
  const hourly=unit===3600000;
  const lab=t=>{const d=new Date(t); return hourly? `${p2(d.getUTCHours())}:00` : `${d.toLocaleString('en-US',{month:'short',timeZone:'UTC'})} ${d.getUTCDate()}`};
  const every=Math.max(1,Math.ceil(data.length/(W/64)));
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Transactions and discrepancies over time">`;
  for(let v=0;v<=top;v+=step){ s+=`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${fmtInt(v)}</text>` }
  data.forEach((d,i)=>{
    const x=ml+i*bw+gap/2, clean=d.total-d.disc;
    const yc=y(clean), yt=y(d.total);
    if(clean>0) s+=`<rect x="${x}" y="${yc}" width="${w}" height="${mt+ih-yc}" fill="var(--bar)"/>`;
    if(d.disc>0) s+=`<rect x="${x}" y="${yt}" width="${w}" height="${Math.max(1,yc-yt-(clean>0?1.5:0))}" rx="${Math.min(2,w/2)}" fill="var(--accent)"/>`;
    const dl=new Date(d.t);
    const when = hourly? `${dl.getUTCFullYear()}-${p2(dl.getUTCMonth()+1)}-${p2(dl.getUTCDate())} ${p2(dl.getUTCHours())}:00` : `${dl.getUTCFullYear()}-${p2(dl.getUTCMonth()+1)}-${p2(dl.getUTCDate())}`;
    s+=`<rect x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${when}<br><b>${fmtInt(d.total)}</b> lines · <b>${fmtInt(d.disc)}</b> discrepancies (${pct(d.disc,d.total).toFixed(1)}%)${d.high?` · ${fmtInt(d.high)} high`:''}"/>`;
    if(i%every===0) s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${lab(d.t)}</text>`;
  });
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="var(--line-strong)"/></svg>`;
  el.innerHTML=s;
}
function bucketLines(L,unit){
  let lo=Infinity,hi=-Infinity; for(const l of L) if(l.ts!==null){ if(l.ts<lo)lo=l.ts; if(l.ts>hi)hi=l.ts }
  if(!isFinite(lo)) return [];
  const mp=new Map(); for(const l of L){ if(l.ts===null) continue; const k=Math.floor(l.ts/unit)*unit; let t=mp.get(k); if(!t){t={t:k,total:0,disc:0,high:0};mp.set(k,t)} t.total++; if(l.disc)t.disc++; if(l.sev==='HIGH')t.high++ }
  if((hi-lo)/unit<=2000) for(let k=Math.floor(lo/unit)*unit;k<=hi;k+=unit) if(!mp.has(k)) mp.set(k,{t:k,total:0,disc:0,high:0});
  return [...mp.values()].sort((a,b)=>a.t-b.t);
}
function niceStep(x){ if(x<=1) return 1; const p=10**Math.floor(Math.log10(x)); const n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p }

function filtered(){
  const L=S.result.lines, v=S.view, f=v.f;
  const q=(f.q||'').trim().toUpperCase();
  const from=f.from?Date.parse(f.from+':00Z'):null, to=f.to?Date.parse(f.to+':59Z'):null;
  const amin=f.amin!==undefined&&f.amin!==''?Math.round(+f.amin*1e6):null, amax=f.amax!==undefined&&f.amax!==''?Math.round(+f.amax*1e6):null;
  const out=[];
  for(const l of L){
    if(v.quick==='disc' && !l.disc) continue;
    if(v.quick==='matched' && l.primary!=='MATCHED') continue;
    if(v.quick==='high' && l.sev!=='HIGH') continue;
    if(v.quick==='ignored' && !l.ignored.length) continue;
    if(f.cat){ if(f.cat==='DUP'){ if(l.primary!=='DUPLICATE_INTERNAL'&&l.primary!=='DUPLICATE_PROVIDER') continue } else if(l.primary!==f.cat && !(f.anyIssue && l.issues.some(x=>x.cat===f.cat))) continue }
    if(f.sev && l.sev!==f.sev) continue;
    if(f.type && l.type!==f.type) continue;
    if(f.merch && (l.mid||'(no merchant)')!==f.merch) continue;
    if(f.status && !((l.a&&l.a.st===f.status)||(l.b&&l.b.st===f.status))) continue;
    if(from!==null && (l.ts===null||l.ts<from)) continue;
    if(to!==null && (l.ts===null||l.ts>to)) continue;
    if(amin!==null && (l.amt===null||Math.abs(l.amt)<amin)) continue;
    if(amax!==null && (l.amt===null||Math.abs(l.amt)>amax)) continue;
    if(q){ if(l._s===undefined){ const p=[]; for(const r of [l.a,l.b]) if(r) p.push(r.txnId,r.provTxnId,r.merchantRef,r.orderId,r.merchantId); l._s=p.join(' ').toUpperCase() } if(!l._s.includes(q)) continue }
    out.push(l);
  }
  const {k,dir}=v.sort;
  const key = { sev:l=>l.sevR*1e15+(l.exposure||0)/1e3, diff:l=>l.diff===null?-Infinity:Math.abs(l.diff), ia:l=>l.a&&l.a.amt!==null?l.a.amt:-Infinity, pa:l=>l.b&&l.b.amt!==null?l.b.amt:-Infinity,
    its:l=>l.a&&l.a.ts!==null?l.a.ts:-Infinity, pts:l=>l.b&&l.b.ts!==null?l.b.ts:-Infinity, conf:l=>l.conf, n:l=>l.n }[k] || (l=>l.n);
  out.sort((a,b)=>{const x=key(a),y=key(b); return x===y? a.n-b.n : (x<y?-1:1)*dir});
  return out;
}

const major = m => m===null||m===undefined? null : Math.round(m/1e4)/100;
function buildAIPayload(){
  const r=S.result, st=r.stats, L=r.lines;
  const byCat={}; Object.entries(st.byCat).forEach(([k,v])=>{ if(v) byCat[k]=v });
  const impact={}; Object.entries(st.impact).forEach(([c,v])=>impact[c]=major(v));
  // time buckets with deterministic elevation flag
  const tb=r.agg.time.filter(t=>t.total>0);
  const rates=tb.filter(t=>t.total>=20).map(t=>t.disc/t.total);
  const mean=rates.reduce((s,x)=>s+x,0)/(rates.length||1), sd=Math.sqrt(rates.reduce((s,x)=>s+(x-mean)**2,0)/(rates.length||1));
  const hourly=r.agg.unit===3600000;
  const time=tb.slice(0,120).map(t=>{const d=new Date(t.t); const rate=t.disc/t.total;
    return {period: hourly? `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:00` : `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}`,
      lines:t.total, discrepancies:t.disc, rate_pct:+(rate*100).toFixed(2), high:t.high, top_categories:Object.entries(t.cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k}:${v}`).join(', '),
      elevated_vs_baseline: t.total>=20 && rate>mean+2*sd && sd>0 }});
  const merchants=r.agg.merch.slice(0,25).map(x=>({merchant:x.mid, lines:x.total, discrepancies:x.disc, rate_pct:+pct(x.disc,x.total).toFixed(2), high:x.high,
    exposure:Object.fromEntries(Object.entries(x.impact).map(([c,v])=>[c,major(v)])), categories:x.cats, share_of_all_discrepancies_pct:+pct(x.disc,st.disc).toFixed(2)}));
  // status transitions, amount-diff values, timing offsets
  const pairs={}, diffs={}, fees={}; const dts=[];
  for(const l of L){
    if(l.a&&l.b){ if(l.a.st!==l.b.st){const k=`${l.a.st||'∅'} → ${l.b.st||'∅'}`; pairs[k]=(pairs[k]||0)+1}
      if(l.issues.some(x=>x.code==='AMOUNT_MISMATCH')){const k=microToStr(l.diff,2); diffs[k]=(diffs[k]||0)+1}
      if(l.issues.some(x=>x.code==='FEE_MISMATCH')){const k=microToStr(l.feeDiff,2); fees[k]=(fees[k]||0)+1}
      if(l.dt!==null && l.type!=='COMPOSITE') dts.push(l.dt) }
  }
  dts.sort((a,b)=>a-b);
  const q=p=>dts.length? +dts[Math.min(dts.length-1,Math.floor(p*dts.length))].toFixed(1) : null;
  const top=(o,n)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k,v])=>({value:k,count:v}));
  // representative examples: up to 3 per category, highest exposure first; identifiers omitted
  const examples=[];
  Object.keys(CATS).filter(c=>c!=='MATCHED').forEach(c=>{
    L.filter(l=>l.primary===c).sort((x,y)=>y.sevR-x.sevR||y.exposure-x.exposure).slice(0,3).forEach(l=>examples.push({
      category:c, severity:l.sev, match_type:l.type, merchant:l.mid||null, currency:l.cur||null,
      internal_amount:l.a?major(l.a.amt):null, provider_amount:l.b?major(l.b.amt):null, difference:major(l.diff),
      internal_status:l.a?l.a.stRaw:null, provider_status:l.b?l.b.stRaw:null,
      internal_time:l.a&&l.a.ts!==null?fmtTs(l.a.ts):null, provider_time:l.b&&l.b.ts!==null?fmtTs(l.b.ts):null,
      issues:l.issues.map(x=>x.code+': '+x.msg).slice(0,4)}));
  });
  return {
    run:{internal_file:r.meta.files.i, provider_file:r.meta.files.p, internal_rows:st.nI, provider_rows:st.nP, blank_rows_skipped:r.meta.blank,
      reconciliation_lines:st.lines, matching_levels:r.meta.keys.map(k=>`L${k.lvl}: internal ${FIELD[k.i].label} = provider ${FIELD[k.p].label}`).concat(r.meta.composite?[`L3 composite: ${r.meta.composite.useM?'merchant+':''}amount${r.meta.composite.useC?'+currency':''}+time ±${S.cfg.tsTolSec}s`]:[]),
      tolerances:{timestamp_s:S.cfg.tsTolSec, amount:S.cfg.amtTol, fee:S.cfg.feeTol, settlement:S.cfg.settleTol, settlement_significant:S.cfg.settleSignificant, rounding:S.cfg.roundDp===''?'none':S.cfg.roundDp+'dp', provider_time_shift_min:S.cfg.provShiftMin},
      time_basis:'Timestamps are wall-clock as exported; no timezone conversion applied beyond the configured provider shift.'},
    totals:{matched_clean:st.matched, discrepancies:st.disc, match_rate_pct:+pct(st.matched,st.lines).toFixed(2), could_not_be_paired:st.unrec,
      by_primary_category:byCat, by_severity:st.bySev, by_match_level:st.byType, all_issue_codes:st.issueCounts, checks_ignored_by_user_rules:st.ignoredCounts, financial_exposure_by_currency:impact,
      exposure_definition:'Per line, the largest of: |amount diff|, amount of a SUCCESS on one side only, |fee diff|, |settlement diff|, amount of a SUCCESS duplicate; summed per currency.'},
    duplicates:{internal_ids:st.dupI.length, internal_extra_rows:st.dupI.reduce((s,x)=>s+x.count-1,0), provider_ids:st.dupP.length, provider_extra_rows:st.dupP.reduce((s,x)=>s+x.count-1,0), with_success_status:st.dupI.filter(x=>x.success).length+st.dupP.filter(x=>x.success).length},
    status_transitions_internal_to_provider:top(pairs,12),
    most_common_amount_differences:top(diffs,10),
    most_common_fee_differences:top(fees,8),
    timestamp_offset_seconds_provider_minus_internal:{sample_size:dts.length, p10:q(.1), median:q(.5), p90:q(.9)},
    merchants_top25_by_discrepancies:merchants, merchant_count:r.agg.merch.length,
    time_buckets:{unit:hourly?'hour':'day', baseline_rate_pct:+(mean*100).toFixed(2), stdev_pct:+(sd*100).toFixed(2), buckets:time},
    representative_examples:examples
  };
}
function aiPrompt(payload){
  return `You are assisting a payments reconciliation analyst. A deterministic engine has already reconciled an internal transaction history against a payment provider report. You are given ONLY aggregated results and a few representative examples (no raw file). Do not re-match transactions.

Analyse the data and identify:
1. Major patterns
2. Concentrations by merchant
3. Time periods with unusual discrepancy rates (use elevated_vs_baseline and rate_pct)
4. Repeated discrepancy types (e.g. identical amount or fee differences, recurring status transitions)
5. Potential operational or system patterns
6. Areas requiring investigation

Strict rules:
- Separate CONFIRMED FACTS (directly computed from the numbers given, cite the numbers) from POTENTIAL EXPLANATIONS (hypotheses) and AREAS REQUIRING INVESTIGATION.
- Never state a root cause as fact. Phrase causes as hypotheses and say what data would confirm or rule each out.
- Only use numbers present in the data. Do not invent merchants, periods, amounts or transactions.
- If data is too thin to support a pattern, say so.
- Be concise and specific; this is for an operations team.

Reply with ONLY a JSON object of this shape:
{"summary":"2-4 sentence overview","confirmed_facts":[{"statement":"...","evidence":"numbers from the data"}],"key_patterns":[{"title":"...","detail":"...","evidence":"..."}],"potential_causes":[{"hypothesis":"...","supporting_data":"...","how_to_confirm":"...","likelihood":"low|medium|high"}],"investigation_priorities":[{"rank":1,"area":"...","severity":"HIGH|MEDIUM|LOW","why":"...","next_step":"..."}]}

DATA:
${JSON.stringify(payload)}`;
}

function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
async function loadDemo(){
  const R=rng(20260923), N=6000, pick=a=>a[Math.floor(R()*a.length)];
  const merchants=['M-1001','M-1017','M-1043','M-1088','M-1102','M-1156','M-1203','M-1240','M-1311','M-1377','M-1402','M-1459'];
  const base=Date.UTC(2026,8,22,0,0,0);
  const iRows=[['Txn ID','PG Reference','Merchant ID','Order No','Amount','Currency','Status','Created At','Fee','Net Amount']];
  const pRows=[['Transaction ID','Merchant Reference','MID','Transaction Amount','CCY','Transaction Status','Transaction Date','Commission','Settlement Amount']];
  const iMap={SUCCESS:'SUCCESS',FAILED:'FAILED',PENDING:'PENDING'}, pMap={SUCCESS:'COMPLETED',FAILED:'DECLINED',PENDING:'PROCESSING'};
  const fmtI=t=>fmtTs(t), fmtP=t=>{const d=new Date(t); return `${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)}/${d.getUTCFullYear()} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`};
  for(let k=0;k<N;k++){
    const hour = Math.floor(Math.pow(R(),0.8)*24); const t=base+hour*3600000+Math.floor(R()*3600000);
    const mid=pick(merchants), amt=pick([500,1000,1500,2000,2500,3000,5000,7500,10000,12500,15000,25000])+ (R()<.3?Math.floor(R()*99)*10:0);
    const st = R()<.86?'SUCCESS':R()<.7?'FAILED':'PENDING';
    const fee=+(amt*0.025).toFixed(2), net=+(amt-fee).toFixed(2);
    const tx='TXN'+(260922000000+k), pg='PG'+(88000000+Math.floor(k*7.3)+Math.floor(R()*5)), ord='ORD-'+(500000+k);
    let pAmt=amt, pSt=pMap[st], pFee=fee, pNet=net, pT=t+Math.floor(R()*20000)-4000, iPg=pg, inI=true, inP=true, iAmt=String(amt.toFixed(2));
    const x=R();
    const hot = mid==='M-1043' && hour>=14 && hour<17;
    if(hot && R()<.35){ pAmt=amt-50; pNet=+(pAmt-fee).toFixed(2) }
    else if(x<.008){ pAmt=amt+pick([-100,-10,10,0.5]); pNet=+(pAmt-fee).toFixed(2) }
    else if(x<.02 && st==='SUCCESS'){ pSt=pMap.FAILED; pNet=0 }
    else if(x<.03 && st==='PENDING'){ pSt=pMap.SUCCESS }
    else if(x>=.03&&x<.04){ inP=false }
    else if(x>=.04&&x<.047){ inI=false; }
    else if(x<.052){ iPg='' }
    else if(x<.057){ iPg=''; }
    else if(x<.067){ pFee=+(fee+pick([5,10,2.5])).toFixed(2); pNet=+(pAmt-pFee).toFixed(2) }
    else if(x<.072){ pNet=+(net-pick([150,250,1000])).toFixed(2) }
    else if(x<.074){ iAmt='N/A' }
    const useTx = !(x>=.052&&x<.057); // for these rows provider lacks merchant ref → composite match
    if(inI) iRows.push([tx,iPg,mid,ord,iAmt,'PKR',iMap[st],fmtI(t),fee.toFixed(2),net.toFixed(2)]);
    if(inP) pRows.push([pg,useTx?tx:'',mid,pAmt.toFixed(2),'PKR',pSt,fmtP(pT),pFee.toFixed(2),pNet.toFixed(2)]);
    if(inI && R()<.0015) iRows.push([tx,iPg,mid,ord,iAmt,'PKR',iMap[st],fmtI(t),fee.toFixed(2),net.toFixed(2)]);
    if(inP && R()<.001) pRows.push([pg,useTx?tx:'',mid,pAmt.toFixed(2),'PKR',pSt,fmtP(pT+1000),pFee.toFixed(2),pNet.toFixed(2)]);
  }
  const csv=rows=>rows.map(r=>r.map(v=>/[",]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n');
  const fi=new File([csv(iRows)],'DEMO_internal_transactions.csv',{type:'text/csv'});
  const fp=new File([csv(pRows)],'DEMO_provider_report.csv',{type:'text/csv'});
  await loadFile('internal',fi,true); await loadFile('provider',fp,true);
  toast('Demo files loaded — generated locally for testing, not real transactions.');
}

function firstKey(){ const mi=S.map.internal, mp=S.map.provider, ok=(m,k)=>m[k]!==undefined&&m[k]!=='';
  return [...(S.keys||[])].sort((a,b)=>a.lvl-b.lvl).find(k=>ok(mi,k.i)&&ok(mp,k.p)) }
function keyColName(side){ const k=firstKey(); if(!k) return side==='internal'?'Internal Txn ID':'Provider Txn ID'; const f=S.files[side]; return f.headers[+S.map[side][side==='internal'?k.i:k.p]] }
function keyVal(r,side){ const k=firstKey(); return k? r[side==='internal'?k.i:k.p] : (r.txnId||r.provTxnId) }
const ID_FIELDS_ALL=['txnId','provTxnId','merchantRef','orderId'];
function otherIds(r,side){ const k=firstKey(), kf=k?(side==='internal'?k.i:k.p):null, f=S.files[side], seen=new Set();
  const out=ID_FIELDS_ALL.filter(x=>x!==kf && r[x]).map(x=>{ const col=f.headers[+S.map[side][x]]; if(seen.has(col)) return ''; seen.add(col); return `<span class="faint" style="font-family:var(--sans);font-size:11px">${esc(col)}</span> ${esc(showId(r[x]))}` }).filter(Boolean);
  return out.length? out.join('<br>') : '<span class="empty-cell">—</span>' }
/* index every ID-like column of one file so a missing row can be searched for anywhere in it */
function crossIndex(side){
  const key='_x'+side; if(S.result[key]) return S.result[key];
  const f=S.files[side], idx=new Map();
  for(const c of idCandidates(side)){ const ci=c.ci; for(let i=0;i<f.rows.length;i++){ const k=normId(f.rows[i][ci],'standard'); if(k&&k.length>=4&&!idx.has(k)) idx.set(k,[ci,f.srcRow[i]]) } }
  return (S.result[key]=idx);
}
function crossHit(r,target){ const idx=crossIndex(target); for(const x of ID_FIELDS_ALL){ if(!r[x]) continue; const h=idx.get(normId(r[x],'standard')); if(h) return {field:x,col:S.files[target].headers[h[0]],row:h[1]} } return null }
function crossCell(r,target){ const h=crossHit(r,target);
  return h? `<span class="badge b-MEDIUM" title="Found in the ${target} file, column “${esc(h.col)}”, row ${h.row}. The matching key may be using the wrong column.">Found in “${esc(h.col)}” row ${h.row}</span>` : `<span class="badge b-none">Not in ${target} file</span>` }
function crossSummary(def,base){

  const hits=base.filter(l=>crossHit(def.side==='a'?l.a:l.b,target)).length;
  const kd=k?`Matching key: internal “${esc(S.files.internal.headers[+S.map.internal[k.i]])}” = provider “${esc(S.files.provider.headers[+S.map.provider[k.p]])}” (${ID_LEVELS[k.fmt||S.cfg.idNorm||'standard'].label} format).`:'';
  return `<div class="notice ${hits?'warn':''}" style="margin-top:10px"><span>${kd} ${hits? `<b>${fmtInt(hits)}</b> of these rows do appear in the ${target} file under another column — check the matching keys on the mapping page.` : `None of these ${fmtInt(base.length)} rows appear anywhere in the ${target} file — every ID column was searched.`}</span></div>`;
}

/* ---- serialise a parsed file into one or more JSON assets ---- */
function fileParts(f){
  const meta={v:1,name:f.name,size:f.size,kind:f.kind,sheet:f.sheet||null,headers:f.headers,blank:f.blank||0,preamble:f.preamble||0,headerRow:f.headerRow||0,demo:!!f.demo};
  const parts=[]; let rows=[], src=[], len=0;
  const flush=()=>{ parts.push({rows,src}); rows=[]; src=[]; len=0 };
  for(let i=0;i<f.rows.length;i++){
    const r=f.rows[i]; let l=20; for(const c of r) l+=(c==null?2:String(c).length+4);
    if(len+l>CHUNK_CHARS && rows.length) flush();
    rows.push(r); src.push(f.srcRow[i]); len+=l;
  }
  if(rows.length||!parts.length) flush();

}
async function uploadWithRetry(blob){
  try{ return await H.assets.upload(blob,{type:'application/json'}) }
  catch(e){ if(e&&e.code==='store_unavailable'){ await new Promise(r=>setTimeout(r,1500)); return await H.assets.upload(blob,{type:'application/json'}) } throw e }
}
function tsRange(recs){ let lo=Infinity,hi=-Infinity; for(const x of recs){ if(x.ts!==null&&x.ts!==undefined){ if(x.ts<lo)lo=x.ts; if(x.ts>hi)hi=x.ts } } return isFinite(lo)?[fmtTs(lo),fmtTs(hi)]:[null,null] }
function rangeFields(ri,rp){ const all=[ri[0],rp[0]].filter(Boolean).sort(), allHi=[ri[1],rp[1]].filter(Boolean).sort();
  return {from:all[0]||null, to:allHi[allHi.length-1]||null, iFrom:ri[0], iTo:ri[1], pFrom:rp[0], pTo:rp[1]} }
function listSummary(r){
  const out={}, maj=o=>Object.fromEntries(Object.entries(o).map(([c,v])=>[c,Math.round(v/1e4)/100]));
  for(const d of LISTS){ const ls=r.lines.filter(d.f); const side=d.side==='b'?'b':'a';
    out[d.k]={n:ls.length, succ:ls.filter(l=>(side==='b'?l.b:l.a).st==='SUCCESS').length, amt:maj(sumByCur(ls,side)),
      succAmt:maj(sumByCur(ls.filter(l=>(side==='b'?l.b:l.a).st==='SUCCESS'),side))} }
  return out;
}
function dailyOf(r){ const o={}; for(const l of r.lines){ if(l.ts===null||l.ts===undefined) continue; const k=fmtTs(l.ts).slice(0,10); const d=o[k]||(o[k]={n:0,d:0,h:0}); d.n++; if(l.disc) d.d++; if(l.sev==='HIGH') d.h++ } return o }
function summaryOf(r){
  const st=r.stats;
  return {v:4, daily:dailyOf(r), lists:listSummary(r), byCat:Object.fromEntries(Object.entries(st.byCat).filter(([k,v])=>v)), sev:{...st.bySev}, dupExtra:st.acctI.dup+st.acctP.dup,
    ...rangeFields(tsRange(r.I),tsRange(r.P)), nI:st.nI,nP:st.nP,lines:st.lines,matched:st.matched,disc:st.disc,unrec:st.unrec,high:st.bySev.HIGH,
    matchRate:+pct(st.matched,st.lines).toFixed(2), impact:Object.fromEntries(Object.entries(st.impact).map(([c,v])=>[c,Math.round(v/1e4)/100]))};
}
function stateOf(){

async function loadSavedFiles(c){
  const files={};
  for(const side of ['internal','provider']){
    let f=null; const rows=[], src=[];
    for(const bid of c.blobs[side]){
      const res=await fetch('/_blob/'+bid); if(!res.ok) throw new Error(`Stored ${side} file could not be read (HTTP ${res.status}).`);
      const j=await res.json(); if(j.part===0) f=j; for(const r of j.rows) rows.push(r); for(const s of j.src) src.push(s);
    }
    if(!f) throw new Error('Stored file is incomplete.');
    files[side]={name:f.name,size:f.size,kind:f.kind,sheet:f.sheet,headers:f.headers,rows,srcRow:src,blank:f.blank,preamble:f.preamble,headerRow:f.headerRow,demo:f.demo,restored:true,sig:side+':'+f.headers.join('|')};
  }
  return files;
}

/* ============ Overview: every saved comparison, per account and combined ============ */
S.ovDemo=false;
function aggComparisons(list){
  const A={n:list.length, nI:0,nP:0,lines:0,matched:0,disc:0,unrec:0,high:0, impact:{}, from:null,to:null, last:null, withLists:0,
    lists:{nip:{n:0,succ:0,amt:{},succAmt:{}},nii:{n:0,succ:0,amt:{},succAmt:{}},pok:{n:0,succ:0,amt:{},succAmt:{}},iok:{n:0,succ:0,amt:{},succAmt:{}}}, byCat:{}, pending:0, months:{}, daily:{}, withDaily:0};
  const add=(o,src)=>{ for(const [c,v] of Object.entries(src||{})) o[c]=(o[c]||0)+(+v||0) };
  for(const c of list){
    const s=c.summary||{};
    A.nI+=s.nI||0; A.nP+=s.nP||0; A.lines+=s.lines||0; A.matched+=s.matched||0; A.disc+=s.disc||0; A.unrec+=s.unrec||0; A.high+=s.high||0; add(A.impact,s.impact);
    if(s.from && (!A.from||s.from<A.from)) A.from=s.from; if(s.to && (!A.to||s.to>A.to)) A.to=s.to;
    if(!A.last||c.createdAt>A.last) A.last=c.createdAt;
    if(s.daily){ const acc=acctOf(c); const T=A.daily[acc]||(A.daily[acc]={}); for(const [k,v] of Object.entries(s.daily)){ const x=T[k]||(T[k]={n:0,d:0,h:0}); x.n+=v.n; x.d+=v.d; x.h+=v.h } A.withDaily++ }
    if(s.v>=2){ A.withLists++; for(const k of Object.keys(A.lists)){ const x=s.lists&&s.lists[k]; if(!x) continue; A.lists[k].n+=x.n; A.lists[k].succ+=x.succ; add(A.lists[k].amt,x.amt); add(A.lists[k].succAmt,x.succAmt) } add(A.byCat,s.byCat) }
    if(!(s.v>=4)) A.pending++;
    const mk=s.from? s.from.slice(0,7) : 'Undated';
    const M=A.months[mk]||(A.months[mk]={n:0,nI:0,lines:0,matched:0,disc:0,impact:{}}); M.n++; M.nI+=s.nI||0; M.lines+=s.lines||0; M.matched+=s.matched||0; M.disc+=s.disc||0; add(M.impact,s.impact);
  }
  // overlapping date ranges within the set can double-count transactions
  A.overlap=0;
  for(const ac of ACCOUNTS){ const dated=list.filter(c=>acctOf(c)===ac.k&&c.summary&&c.summary.from).sort((a,b)=>a.summary.from<b.summary.from?-1:1);
    for(let i=1;i<dated.length;i++) if(dated[i].summary.from<=dated[i-1].summary.to) A.overlap++ }
  return A;
}

/* daily discrepancy chart: bars stacked by account, one bar per calendar day */
function dailySeries(A,accts){
  const keys=new Set(); accts.forEach(a=>Object.keys(A.daily[a.k]||{}).forEach(k=>keys.add(k)));
  if(!keys.size) return [];
  let ks=[...keys].sort();
  const t0=Date.parse(ks[0]+'T00:00:00Z'), t1=Date.parse(ks[ks.length-1]+'T00:00:00Z');
  if((t1-t0)/86400000<=400){ ks=[]; for(let t=t0;t<=t1;t+=86400000) ks.push(new Date(t).toISOString().slice(0,10)) }
  return ks.map(k=>({k, parts:accts.map(a=>({a, ...( (A.daily[a.k]||{})[k] || {n:0,d:0,h:0})}))}));
}
function drawDaily(el,rows){
  if(!el) return;
  if(!rows.length){ el.innerHTML='<p class="faint" style="padding:36px 0;text-align:center">No dated transactions yet.</p>'; return }
  const W=el.clientWidth||600, H=200, ml=44, mr=8, mt=10, mb=26, iw=W-ml-mr, ih=H-mt-mb;
  const max=Math.max(1,...rows.map(r=>r.parts.reduce((s,p)=>s+p.d,0)));
  const step=niceStep(max/4), top=Math.ceil(max/step)*step, y=v=>mt+ih-(v/top)*ih;
  const bw=iw/rows.length, gap=Math.min(2,bw*.25), w=Math.min(48,Math.max(1,bw-gap)), every=Math.max(1,Math.ceil(rows.length/(W/58)));
  const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const lab=k=>`${+k.slice(8,10)} ${mon[+k.slice(5,7)-1]}`;
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Discrepancies per day">`;
  for(let v=0;v<=top;v+=step) s+=`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${ml-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${fmtInt(v)}</text>`;
  rows.forEach((r,i)=>{
    const x=ml+i*bw+(bw-w)/2; let acc=0; const segs=r.parts.filter(p=>p.d>0);
    segs.forEach((p,j)=>{ const y0=y(acc), y1=y(acc+p.d); acc+=p.d; const last=j===segs.length-1;
      s+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(1,y0-y1-(j>0?1.5:0))}" ${last?`rx="${Math.min(2,w/2)}"`:''} fill="${p.a.color}"/>` });
    const tot=r.parts.reduce((t,p)=>t+p.n,0), dd=r.parts.reduce((t,p)=>t+p.d,0), hh=r.parts.reduce((t,p)=>t+p.h,0);
    const per=r.parts.length>1? r.parts.map(p=>`<br>${p.a.name}: <b>${fmtInt(p.d)}</b> of ${fmtInt(p.n)}`).join('') : '';
    s+=`<rect x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${lab(r.k)} ${r.k.slice(0,4)}<br><b>${fmtInt(dd)}</b> discrepancies of ${fmtInt(tot)} lines (${tot?(dd/tot*100).toFixed(1):'0.0'}%)${hh?` · ${fmtInt(hh)} high`:''}${per}"/>`;
    if(i%every===0) s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${lab(r.k)}</text>`;
  });
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="var(--line-strong)"/></svg>`;
  el.innerHTML=s;
}

function ovCats(A){
  const e=Object.entries(A.byCat).filter(([k])=>k!=='MATCHED').sort((a,b)=>b[1]-a[1]); if(!e.length) return '<p class="faint" style="font-size:12.5px">No discrepancies recorded.</p>';

/* Storage
   days/{acct}_{YYYY-MM-DD}      one document per business day (totals, sessions, close state, audit)
   cases/{acct}_{YYYY-MM-DD}_{n} open items raised on that day, keyed by transaction ID (max ~400 per doc) */
const SESSIONS={am:{label:'AM',long:'12:00 AM – 11:59 AM',from:0,to:43200},pm:{label:'PM',long:'12:00 PM – 11:59 PM',from:43200,to:86400},day:{label:'Day',long:'12:00 AM – 11:59 PM',from:0,to:86400}};
/* Ledgers: one per account + payment method. Stored documents carry the ledger key in `account`
   (the Dhub/JC ledger keeps its original key "dhub" so September's records stay where they are). */
const PROVIDERS={
  jc:{name:'JC',long:'JC portal',success:'Completed'},
  ep:{name:'EP',long:'EP transaction report',success:'Success',settlement:true},
  swp:{name:'Swich',long:'Swich payout report',success:'paid',payout:true,tender:'EASYPAISA'},
  jcp:{name:'JC',long:'JC payout report',success:'COMPLETED',payout:true,tender:'JAZZCASH',fees:['FEE','FED']}
};
const LEDGERS=[
  {k:'dhub',acct:'dhub',prov:'jc'},
  {k:'dpaisa-ep',acct:'dpaisa',prov:'ep'},
  {k:'dpaisa-jc',acct:'dpaisa',prov:'jc'},
  {k:'dpaisa-swp',acct:'dpaisa',prov:'swp'},
  {k:'dpaisa-jcp',acct:'dpaisa',prov:'jcp'}

const dpWord=k=>isPayout(k)?'approved':'successful';

const lgSeg=()=>{ const b=l=>`<button data-lacct="${l.k}" class="${LG.acct===l.k?'on':''}">${acctName(l.acct)} · ${PROVIDERS[l.prov].name}</button>`;

const windowed=acct=>LGR(acct).prov==='ep'||isPayout(acct);

function ledgerSubscribe(){

}
function refreshLedgerViews(){ if(S.step==='hub'&&typeof renderHubBody==='function'){ if(HUB.mode==='month') renderHub($('#main')); else renderHubBody() } if(S.step==='ledger') renderLedgerBody(); if(S.step==='dayv') renderDayBody(); if(S.step==='cases') renderCasesBody() }
const dayId=(a,d)=>`${a}_${d}`;
const noId=o=>{ const x={...o}; delete x.id; return x };
const todayStr=()=>{ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}` };
const addDays=(ds,n)=>{ const t=Date.parse(ds+'T00:00:00Z')+n*86400000; return new Date(t).toISOString().slice(0,10) };
const dLabel=ds=>{ const d=new Date(ds+'T00:00:00Z'); return `${p2(d.getUTCDate())} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]} ${d.getUTCFullYear()}` };
const pk=v=>(v/1e6).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
function allCases(acct){ const out=[]; for(const d of Object.values(LG.cases)){ if(d.account!==acct) continue; for(const [k,c] of Object.entries(d.items||{})) out.push({...c,key:k,date:d.date,doc:d.id,lg:d.account}) } return out }
function acctStart(acct){ let m=null; for(const d of Object.values(LG.days)) if(d.account===acct&&(!m||d.date<m)) m=d.date; return m }
function sessionState(day,s,acct,date){
  const d=day&&day.sessions&&day.sessions[s];
  if(day&&day.skipped) return 'skip';
  if(day&&day.source==='historic') return 'imp';
  if(d&&d.runAt) return 'ok';
  const st=acctStart(acct); if(!st||date<st) return 'none';
  const now=new Date(), [y,m,dd]=date.split('-').map(Number);
  const due = s==='am'? new Date(y,m-1,dd,13,0,0) : s==='day'? new Date(y,m-1,dd+1,12,0,0) : new Date(y,m-1,dd+1,1,0,0);
  return now>due? 'late' : 'none';
}

/* ---------- roll-forward of open items ---------- */
/* The day an item counts as resolved in the trackers. Manual resolves count on the item's own day, so later days no longer carry it
   (the date the resolve was actually done is kept in r.day / r.at). Auto-resolves count on the day the confirming report came in. */
function resDay(c){ if(c.st!=='res'||!c.r) return null; return c.r.auto? (c.r.day||c.date) : c.date }
function rollFor(acct,date,cases){
  let open=0,neu=0,res=0,closeAmt=0,left=0;
  for(const c of cases){
    const rDay=resDay(c);
    if(c.date<date && (!rDay || rDay>=date)) open++;
    if(c.date===date){ neu++; if(c.st!=='res') left++ }
    if(rDay===date) res++;
    if(c.date<=date && (!rDay || rDay>date)) closeAmt+=c.a||0;
  }
  return {open,neu,res,close:open+neu-res,closeAmt,left};
}
