/* ---------- file profiles (remembered layouts) ---------- */
function detectProfile(f){
  const h=f.headers.map(x=>x.toLowerCase()), has=x=>h.includes(x.toLowerCase());
  // Dpaisa payin and payout exports share the same columns — tell them apart by the rows' Payment Type (PayIn / PayOut)
  if(has('Date Time')&&has('Transaction ID')&&has('Status')&&has('Amount')) return dpKind(f);
  if(has('Reference Id')&&has('Transaction Id')&&has('Settlement Amount')&&has('Date')&&has('Time')&&has('Transaction Type')) return 'swp';
  if(has('TRANS_ID')&&has('DATETIME')&&has('TRX_STATUS')&&has('TRX_AMT')) return 'jcp';
  if(has('TRANSID')&&has('DATETIME')&&has('TRXSTATUS')&&has('TRXAMT')) return 'jcp';
  if(has('System Date Time')&&has('Bill Reference')&&has('Status')&&has('Amount')) return 'jc';
  // EP portal export with one TrxTime date-time column and response codes (status comes from the response code)
  if(has('CustomerTransactionId')&&has('OrderId')&&has('TrxTime')&&!has('TrxDate')&&has('Amount')&&(has('CustomerResponseCode')||has('ChannelResponseCode')||has(EP_RC_STATUS))){ f.epv2=true; return 'ept' }
  if(has('CustomerTransactionId')&&has('OrderId')&&has('TrxDate')&&has('TrxTime')&&has('Status')&&has('Amount')) return 'ept';
  if(has('Customer TransactionId')&&has('Order Id')&&has('Transaction Date')&&has('Transaction Time')&&has('Settlement Amount')) return 'eps';
  return null;
}
function dpKind(f){
  const ix=n=>f.headers.findIndex(x=>String(x).toLowerCase()===n);
  const pt=ix('payment type'), po=ix('payout type'); let pin=0,pout=0;
  const step=Math.max(1,Math.floor(f.rows.length/5000));
  for(let i=0;i<f.rows.length;i+=step){ const r=f.rows[i];
    if(pt>=0){ const v=String(r[pt]??'').trim().toUpperCase().replace(/[\s\-_]+/g,''); if(v==='PAYOUT') pout++; else if(v==='PAYIN') pin++ }
    else if(po>=0){ String(r[po]??'').trim()? pout++ : pin++ } }
  f.payMix={pin,pout};
  return pout>pin?'dpp':'dp';
}
/* which layout a file has, for this ledger and side: built-in Dpaisa / JC, or a layout saved here */
function setProfile(f,acct,side){

  if(built&&PROFILE_NAMES[built]){ f.profile=null; f.wrong=built; return }
  if(side==='settle'){ f.profile=null; return }
  const p=LG.profiles[`${acct}_${side}`]; const h=new Set(f.headers.map(x=>String(x).toLowerCase()));

  f.profile=null;

function profileMap(f,side){

  if(f.profile==='dp') return {txnId:ix('Transaction ID'),provTxnId:ix('Gateway Transaction Id'),merchantRef:ix('Merchant Transaction ReferenceID'),amount:ix('Amount'),status:ix('Status'),ts:ix('Date Time')};
  if(f.profile==='jc') return {txnId:ix('Bill Reference'),provTxnId:ix('Transaction Reference Number'),amount:ix('Amount'),status:ix('Status'),ts:ix('System Date Time')};
  if(f.profile==='ept') return {txnId:ix('CustomerTransactionId'),provTxnId:ix('OrderId'),amount:ix('Amount'),status:ix(EP_RC_STATUS)!==undefined?ix(EP_RC_STATUS):ix('Status'),ts:ix(TS_COL)};

/* EP files: drop personal-data columns, join the separate date and time columns into one timestamp column */
function prepFile(f){

/* core: check a settlement batch against a session's EP successes. opt.settledElsewhere = keys settled in other parts of an imported month */
async function settleCore(acct,ds,s,fsb,pf,pm,smap,orderP,dayDoc,docs,opt={}){

  if(fromOther&&!opt.settledElsewhere) checks.push({lvl:'ok',msg:`${fmtInt(fromOther)} batch rows are not successes in this session’s report — usually cut-off transactions from the previous session (${fmtInt(cleared)} open “not settled” items cleared)`});

async function recheckLedger(acct){
  if(!H.db||!H.assets){ toast('Saving isn’t available in this view.'); return }
  const P=PN(acct), sess=[];
  for(const d of Object.values(LG.days)) if(d.account===acct&&d.sessions) for(const [s,ss] of Object.entries(d.sessions)) if(ss&&ss.runAt&&ss.files&&ss.files.internal&&ss.files.internal.blobs&&ss.files.provider&&ss.files.provider.blobs) sess.push({date:d.date,s,ss,ord:sessOrd(d.date,s)});
  sess.sort((a,b)=>a.ord<b.ord?-1:1);
  const docs=caseDocsCopy(acct), dirty=new Set(), now=new Date().toISOString(); let resN=0, updN=0;
  const openItems=()=>{ const o=[]; for(const [id,d] of Object.entries(docs)) for(const [k,it] of Object.entries(d.items)) if(it.st!=='res'&&it.src!=='settle') o.push({...it,key:k,doc:id,date:d.date}); return o };
  if(!openItems().length){ toast('No open items to check.'); return }
  try{
    for(let i=0;i<sess.length;i++){ const x=sess[i]; const cand=openItems().filter(c=>sessOrd(c.date,c.s||'am')<x.ord); if(!cand.length) continue;
      overlay(true,'Re-checking open items',`${dLabel(x.date)} ${SESSIONS[x.s].label} · ${i+1} of ${sess.length}`); await nextFrame();
      const fi=await loadBlobFile(x.ss.files.internal.blobs), fp=await loadBlobFile(x.ss.files.provider.blobs);
      const dpIdx=idxFromFile(fi,x.ss.map.internal,x.ss.prof&&x.ss.prof.internal?profStatusMap(x.ss.prof.internal):null), jcIdx=idxFromFile(fp,x.ss.map.provider,x.ss.prof&&x.ss.prof.provider?profStatusMap(x.ss.prof.provider):null);
      const here=`${dLabel(x.date)} ${SESSIONS[x.s].label}`;
      for(const c of cand){ const v=confirmCheck(c,dpIdx.get(c.key),jcIdx.get(c.key),P); if(!v) continue; const it=docs[c.doc].items[c.key];
        if(v.res){ docs[c.doc].items[c.key]={...it,st:'res',r:{reason:REASONS[0],note:v.res+` (${here} file, re-check)`,at:now,day:x.date,auto:true}}; resN++ }
        else if(v.upd){ docs[c.doc].items[c.key]={...it,upd:{note:v.upd,at:now,where:here}}; updN++ }
        dirty.add(c.doc) } }
    let stlN=0;
    if(provOf(acct).settlement){ const need=()=>openItems().filter(c=>STL_TYPES.has(c.t)&&!(c.stl&&c.stl.st==='settled'));
      for(const x of sess){ const bs=x.ss.settle; if(!bs||!bs.blobs||!need().length) continue;
        overlay(true,'Checking settlement batches',`${dLabel(x.date)} ${SESSIONS[x.s].label}`); await nextFrame();
        const fb=await loadBlobFile(bs.blobs), c=settleCols(fb), m=new Map(); for(const r of fb.rows){ const k=normId(r[c.id],'standard'); if(k) m.set(k,{net:mic(c.net>=0?r[c.net]:r[c.set]),date:String(r[c.sd]??'').trim()}) }
        for(const it of need()){ const bx=m.get(it.key); if(!bx) continue; docs[it.doc].items[it.key]={...docs[it.doc].items[it.key],stl:{st:'settled',date:bx.date,net:bx.net,batch:bs.name,day:x.date}}; dirty.add(it.doc); stlN++ } } }
    overlay(true,'Saving',`${dirty.size} document(s)`);
    for(const id of dirty) await H.db.collection('cases').doc(id).set(docs[id]);
    toast(sess.length?`Re-check done · ${fmtInt(resN)} confirmed and resolved, ${fmtInt(updN)} seen but not confirmed${stlN?`, ${fmtInt(stlN)} found in EP settlement batches`:''}`:'No saved daily reports to check against yet');
  }catch(e){ console.error(e); toast('Re-check failed: '+((e&&(e.code||e.message))||e)) }
  overlay(false); refreshLedgerViews();
}

const addMonths=(m,n)=>{ const [y,mo]=m.split('-').map(Number); return new Date(Date.UTC(y,mo-1+n,1)).toISOString().slice(0,7) };

/* date order for a month file: detected, else whichever reading puts more rows inside the month */
function pickOrderMonth(f,col,month,fallback){
  const det=detectDateOrder(colValues(f,col)); if(det) return det;
  const step=Math.max(1,Math.floor(f.rows.length/5000)), sc=o=>{ let n=0; for(let i=0;i<f.rows.length;i+=step){ const t=parseTs(f.rows[i][col],o); if(t!==null&&fmtTs(t).slice(0,7)===month) n++ } return n };
  const a=sc('MDY'), b=sc('DMY'); return a>b?'MDY':b>a?'DMY':(fallback||'MDY');

/* split a month file's rows into {date|session} buckets; rows outside the month or without a readable time are counted, never silently lost */
function bucketFile(f,side,acct,month){
  const m=side==='settle'? {ts:f.headers.indexOf(TS_COL)} : profileMap(f,side), col=m.ts, out={b:new Map(),outside:0,noTime:0,future:0,order:null,total:f.rows.length};
  if(col===undefined||col<0){ out.noTs=true; return out }
  const order=side==='settle'?'DMY':pickOrderMonth(f,col,month,side==='internal'?'DMY':'MDY'); out.order=order; const today=todayStr(), SK=sessKeys(acct);
  f.rows.forEach((r,i)=>{ const t=parseTs(r[col],order); if(t===null){ out.noTime++; return } const ts=fmtTs(t), d=ts.slice(0,10);
    if(d.slice(0,7)!==month){ out.outside++; return } if(d>today){ out.future++; return }
    const sec=(t-Date.parse(d+'T00:00:00Z'))/1000, s=SK.find(k=>sec>=SESSIONS[k].from&&sec<SESSIONS[k].to)||SK[SK.length-1];
    const key=d+'|'+s; let x=out.b.get(key); if(!x){ x={rows:[],src:[]}; out.b.set(key,x) } x.rows.push(r); x.src.push(f.srcRow[i]) });
  return out;
}

  const sess=keys.map(k=>{ const [ds,s]=k.split('|'), day=LG.days[dayId(acct,ds)], has=day&&(day.source==='historic'||(day.sessions&&day.sessions[s]&&day.sessions[s].runAt));
    return {k,ds,s,nI:(bi.b.get(k)||{rows:[]}).rows.length,nP:(bp.b.get(k)||{rows:[]}).rows.length,nS:bs?(bs.b.get(k)||{rows:[]}).rows.length:0,exists:!!has,historic:!!(day&&day.source==='historic'),closed:!!(day&&(day.closed||day.skipped)),skipped:!!(day&&day.skipped)} });

  { const sk=[...new Set(sess.filter(x=>x.skipped&&(x.nI||x.nP)).map(x=>x.ds))]; if(sk.length) checks.push({lvl:'warn',msg:`${sk.map(dLabel).join(', ')} ${sk.length>1?'are':'is'} marked as skipped (no transactions) but the files have rows on ${sk.length>1?'them':'it'} — undo the skip on the day page to import ${sk.length>1?'them':'it'}`}) }

/* settlement only: the month's EP settlement report against sessions that are already reconciled (their saved EP files are reused) */
function miPlanSettle(){
  const M=LG.mi, acct=M.acct, fs=M.files.settle, bs=bucketFile(fs,'settle',acct,M.month), checks=[];
  const keys=new Set(bs.b.keys());
  for(const d of Object.values(LG.days)) if(d.account===acct&&d.date&&d.date.startsWith(M.month)&&d.sessions) for(const s of sessKeys(acct)) if(d.sessions[s]&&d.sessions[s].runAt) keys.add(d.date+'|'+s);
  const sess=[...keys].sort((a,b)=>{ const [da,sa]=a.split('|'),[db,sb]=b.split('|'); return sessOrd(da,sa)<sessOrd(db,sb)?-1:1 }).map(k=>{ const [ds,s]=k.split('|'), day=LG.days[dayId(acct,ds)], ss=day&&day.sessions&&day.sessions[s];
    return {k,ds,s,nI:null,nP:null,nS:(bs.b.get(k)||{rows:[]}).rows.length,exists:!!(ss&&ss.runAt&&ss.files&&ss.files.provider&&ss.files.provider.blobs),closed:!!(day&&day.closed),hasSettle:!!(ss&&ss.settle)} });
  const t=settleTotals(fs);
  checks.push({lvl:'ok',msg:`EP settlement report recognised · ${fmtInt(fs.rows.length)} rows · gross PKR ${pk(t.gross)}, net PKR ${pk(t.net)}`});
  checks.push({lvl:'ok',msg:'Settlement only — the transaction files saved with each reconciled session are used; nothing is re-reconciled'});
  if(bs.noTs) checks.push({lvl:'bad',msg:'Settlement report: no transaction date/time — rows can’t be placed on sessions'});
  else { const inN=[...bs.b.values()].reduce((s,x)=>s+x.rows.length,0); checks.push({lvl:inN?'ok':'warn',msg:`${fmtInt(inN)} of ${fmtInt(bs.total)} settlement rows are for transactions in ${monthLabel(M.month)}${bs.outside?` · ${fmtInt(bs.outside)} from other months (still used to mark those transactions settled)`:''}`}) }
  const miss=sess.filter(x=>!x.exists&&x.nS); if(miss.length) checks.push({lvl:'warn',msg:`${fmtInt(miss.length)} session(s) have settlement rows but aren’t reconciled yet (${miss.slice(0,4).map(x=>dLabel(x.ds)+' '+SESSIONS[x.s].label).join(', ')}${miss.length>4?'…':''}) — they are skipped`});
  if(sess.some(x=>x.exists&&x.hasSettle)) checks.push({lvl:'warn',msg:'Some sessions already have a settlement batch recorded — it will be replaced by this report’s rows for that session'});
  M.plan={mode:'settle',sess,bs,checks};
}

/* ============ Transaction lists across a date range: all saved sessions of a ledger, matched as one set ============ */
LG.tl=null;   // {acct, from, to}

function tlSessions(acct,from,to){
  const out=[], skipped=[];
  for(const d of Object.values(LG.days)){ if(d.account!==acct||d.date<from||d.date>to) continue;
    const ss=d.sessions||{}, keys=Object.keys(ss).filter(s=>ss[s]&&ss[s].runAt);
    if(!keys.length){ skipped.push(d.date); continue }
    for(const s of keys){ const x=ss[s]; if(x.files&&x.files.internal&&x.files.internal.blobs&&x.files.provider&&x.files.provider.blobs) out.push({date:d.date,s,ss:x}); else skipped.push(d.date+' '+SESSIONS[s].label) } }
  out.sort((a,b)=>sessOrd(a.date,a.s)<sessOrd(b.date,b.s)?-1:1);
  return {sess:out,skipped};
}
/* join several stored files into one, lining columns up by header name (layouts can differ slightly between months) */

function wdState(acct,ds){ if(!LG.wd||LG.wd.acct!==acct||LG.wd.ds!==ds) LG.wd={acct,ds,open:false,files:{},replace:false,swap:false}; return LG.wd }

  const todo=pl?pl.sess.filter(x=>x.run):[], stlN=pl?Object.values(pl.asg).filter(Boolean).length:0;
  const blocked=pl&&(pl.stlOnly? !pl.sess.some(x=>x.exists) : pl.bi.noTs||pl.bp.noTs||!(pl.bi.b.am.rows.length+pl.bi.b.pm.rows.length)||!(pl.bp.b.am.rows.length+pl.bp.b.pm.rows.length));
  return `<section class="panel" style="border-color:var(--accent)"><div class="panel-h"><h2>Whole day · ${esc(lgName(acct))}</h2><span class="faint" style="font-size:12.5px">One full-day file per side — split into the AM and PM sessions by each row’s time</span><span class="spacer"></span><button class="btn sm ghost" id="wdClose">Close</button></div>
    <div class="panel-b stack" style="gap:10px">
      ${closed?'<div class="notice warn">This day is closed. Reopen it to upload files.</div>':''}
      <div class="grid-2">${wdSlot('internal','Dpaisa payin export · full day',W.files.internal,acct)}${wdSlot('provider',`${P} ${SETL?'transaction report':'portal export'} · full day`,W.files.provider,acct)}</div>
      ${SETL?`<div class="grid-2">${wdSlot('s1','EP settlement report 1',W.files.s1,acct)}${wdSlot('s2','EP settlement report 2',W.files.s2,acct)}</div>`:''}
      ${pl?chk(pl.checks):''}
      ${pl?`<div class="scroll-x"><table class="t"><thead><tr><th>Session</th><th class="num">Dpaisa rows</th><th class="num">${esc(P)} rows</th>${SETL?'<th>Settlement report</th>':''}<th>Will</th></tr></thead><tbody>
        ${pl.sess.map(x=>{ const a=pl.asg[x.s];
          return `<tr><td class="mono">${SESSIONS[x.s].label} · ${SESSIONS[x.s].long}</td><td class="num">${x.nI==null?'<span class="faint">saved</span>':fmtInt(x.nI)}</td><td class="num">${x.nP==null?'<span class="faint">saved</span>':fmtInt(x.nP)}</td>
          ${SETL?`<td>${a?`${esc(a.f.name)} <span class="faint">(${fmtInt(a.g.am)} AM / ${fmtInt(a.g.pm)} PM transactions)</span>`:'<span class="faint">—</span>'}</td>`:''}
          <td>${pl.stlOnly?(pl.closed?'<span class="badge b-none">Skip · day closed</span>':!x.exists?'<span class="badge b-none">Not reconciled yet</span>':pl.asg[x.s]?`<span class="badge b-ok">${x.hasSettle?'Replace':'Record'} settlement</span>`:'<span class="badge b-none">No report</span>'):pl.closed?'<span class="badge b-none">Skip · day closed</span>':x.exists?(x.run?'<span class="badge b-MEDIUM">Replace session</span>':'<span class="badge b-none">Skip · already reconciled</span>'):'<span class="badge b-ok">Reconcile</span>'}</td></tr>` }).join('')}
        </tbody></table></div>
        <div class="row" style="gap:12px">
          ${pl.sess.some(x=>x.exists)&&!pl.closed?`<label class="row" style="gap:6px;font-size:12.5px"><input type="checkbox" id="wdReplace" ${W.replace?'checked':''}> Replace sessions that already have data <span class="faint">(items resolved by hand stay resolved)</span></label>`:''}
          ${SETL&&stlN?`<button class="btn sm" id="wdSwap" title="Swap which settlement report goes to AM and which to PM">Swap AM ↔ PM reports</button>`:''}
          <span class="spacer"></span>
          <span class="faint" style="font-size:12.5px">${fmtInt(todo.length)} session${todo.length===1?'':'s'} to reconcile${stlN?` · ${stlN} settlement report${stlN>1?'s':''}`:''}</span>
          <button class="btn primary" id="wdGo" ${(todo.length||stlN)&&!pl.closed&&!blocked?'':'disabled'}>${todo.length?`Reconcile ${todo.map(x=>SESSIONS[x.s].label).join(' + ')}${stlN?' + settlement':''}`:stlN?'Record settlement':'Record'}</button></div>`
      :`<p class="faint" style="font-size:12.5px">Add both full-day files. Each row is placed in the AM (12:00 AM – 11:59 AM) or PM (12:00 PM – 11:59 PM) session by its own time, then AM and PM are reconciled in order — exactly as if you had uploaded them one by one.${SETL?' Settlement reports are optional and are attached to the session most of their transactions belong to. <b>Already reconciled?</b> Add just the settlement reports — the saved transaction files are used.':''}</p>`}
    </div></section>`;
}
function bindWholeDay(acct,ds){
  const W=wdState(acct,ds);
  const o=$('#wdOpen'); if(o) o.onclick=()=>{ W.open=true; renderDayBody() };
  const c=$('#wdClose'); if(c) c.onclick=()=>{ LG.wd=null; renderDayBody() };
  const load=async(side,file)=>{ overlay(true,'Reading '+file.name,'Parsing locally in this browser'); await nextFrame();
    try{ const f=await readFile(file); f.headerRow=guessHeaderRow(f.raw); buildTable(f); const ps=side==='s1'||side==='s2'?'settle':side; setProfile(f,acct,ps); prepFile(f); W.files[side]=f }catch(e){ toast(e.message||String(e)) }
    overlay(false); renderDayBody() };
  document.querySelectorAll('[data-wpick]').forEach(b=>{ const side=b.dataset.wpick, inp=$(`#wpick-${side}`); b.onclick=()=>inp.click(); inp.onchange=()=>{ if(inp.files[0]) load(side,inp.files[0]) } });
  document.querySelectorAll('[data-wside]').forEach(sl=>{ sl.addEventListener('dragover',e=>e.preventDefault()); sl.addEventListener('drop',e=>{ e.preventDefault(); if(e.dataTransfer.files[0]) load(sl.dataset.wside,e.dataTransfer.files[0]) }) });
  const r=$('#wdReplace'); if(r) r.onchange=()=>{ W.replace=r.checked; renderDayBody() };
  const sw=$('#wdSwap'); if(sw) sw.onclick=()=>{ W.swap=!W.swap; renderDayBody() };
  const g=$('#wdGo'); if(g) g.onclick=()=>runWholeDay(acct,ds);
}
async function runWholeDay(acct,ds){
  const W=wdState(acct,ds), pl=wdPlan(acct,ds); if(!pl||pl.closed) return;
  if(!H.db||!H.assets){ toast('Saving isn’t available in this view.'); return }
  const fi=W.files.internal, fp=W.files.provider, P=PN(acct), at=new Date().toISOString();
  const st={docs:caseDocsCopy(acct),days:{...LG.days}}, did=dayId(acct,ds);
  const imported=pl.stlOnly?null:{from:'day',at,files:[fi.name,fp.name]};
  const ran={}; let newN=0, autoN=0, stlMsg=[];
  try{
    for(const x of pl.sess){ if(!x.run) continue;
      overlay(true,`Reconciling ${SESSIONS[x.s].label} session`,`${dLabel(ds)} · from whole-day files`); await nextFrame();
      const files={internal:subFile(fi,pl.bi.b[x.s],ds,x.s,pl.bi.order),provider:subFile(fp,pl.bp.b[x.s],ds,x.s,pl.bp.order)};
      files.internal.name=`${fi.name} · ${SESSIONS[x.s].label}`; files.provider.name=`${fp.name} · ${SESSIONS[x.s].label}`;
      const checks=[{lvl:'ok',msg:`Taken from whole-day files: ${fmtInt(files.internal.rows.length)} Dpaisa rows and ${fmtInt(files.provider.rows.length)} ${P} rows fall in ${SESSIONS[x.s].long}`},
        ...pl.checks.filter(c=>/recognised|matches this day|totals agree|footer says|Personal-data|PayOut/.test(c.msg))];
      if(!files.internal.rows.length||!files.provider.rows.length) checks.push({lvl:'warn',msg:`${!files.internal.rows.length?'Dpaisa':P} has no rows in this session`});
      const out=await reconcileCore(acct,ds,x.s,files,checks,st,{imported,progress:m=>overlay(true,m,`${SESSIONS[x.s].label} session`),
        auditMsg:(n,a)=>`${SESSIONS[x.s].label} session reconciled from whole-day files (${fi.name} + ${fp.name}) · ${n} new item(s), ${a} auto-resolved`});
      ran[x.s]=files.provider; newN+=out.fresh.length; autoN+=out.autoN }
    // settlement reports, after both sessions so the PM run can't disturb them
    for(const s of ['am','pm']){ const a=pl.asg[s]; if(!a) continue;
      const dayDoc=st.days[did], ss=dayDoc&&dayDoc.sessions&&dayDoc.sessions[s];
      if(!ss||!ss.runAt){ stlMsg.push(`${SESSIONS[s].label} report skipped — that session has no reconciliation yet`); continue }
      overlay(true,'Recording settlement batch',`${dLabel(ds)} ${SESSIONS[s].label} · ${a.f.name}`); await nextFrame();
      let pf=ran[s], pm;
      if(pf) pm=profileMap(pf,'provider'); else { pf=await loadBlobFile(ss.files.provider.blobs); setProfile(pf,acct,'provider'); pm=ss.map.provider }
      const smap=parseStatusMap(ss.prof&&ss.prof.provider?profStatusMap(ss.prof.provider):DEFAULT_STATUS_MAP).map;
      const so=await settleCore(acct,ds,s,a.f,pf,pm,smap,ss.orders&&ss.orders.provider,dayDoc,st.docs);
      st.days[did]={id:did,...so.dayDoc}; stlMsg.push(`${SESSIONS[s].label}: ${so.notSettled} not settled yet${so.cleared?`, ${so.cleared} earlier cleared`:''}`) }
    LG.wd=null; LG.draft={am:{},pm:{},day:{}};
    toast(pl.stlOnly?`${dLabel(ds)} settlement recorded · ${stlMsg.join(' · ')}`:`${dLabel(ds)} reconciled from whole-day files · ${fmtInt(newN)} new item(s)${autoN?`, ${fmtInt(autoN)} cleared`:''}${stlMsg.length?' · '+stlMsg.join(' · '):''}`);
  }catch(e){ console.error(e); toast('Whole-day upload stopped: '+((e&&(e.code||e.message))||e)+' — sessions finished before it were saved') }
  overlay(false); renderDayBody();
}

/* ============ Dashboard: every ledger (payins + payouts) and the archive, for a chosen period ============ */
const HUB={mode:'month', month:null, from:'', to:''};
const HUB_SERIES=[{k:'dhub',c:'var(--s1)'},{k:'dpaisa-ep',c:'var(--s2)'},{k:'dpaisa-swp',c:'var(--s3)'},{k:'dpaisa-jcp',c:'var(--s4)'},{k:'dpaisa-jc',c:'var(--s6)'}];
const HUB_ARCH_C='var(--s5)';
const HUB_TYPE={NOT_IN_JC:'Not at provider / not paid',NOT_IN_DP:'Not in Dpaisa',JC_NOT_SUCCESS:'Provider not successful',DP_NOT_SUCCESS:'Dpaisa not approved / paid-declined',AMOUNT_DIFF:'Amount differs',DUP_SUCCESS:'Duplicate',NOT_SETTLED:'Not settled yet',SETTLE_AMT:'Settled amount differs'};
const kfmt=v=>{ const a=Math.abs(v); return a>=1e9?(v/1e9).toFixed(1)+'B':a>=1e6?(v/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?(v/1e3).toFixed(a>=1e4?0:1)+'k':String(Math.round(v)) };
const lastDay=m=>{ const [y,mo]=m.split('-').map(Number); return `${m}-${p2(new Date(Date.UTC(y,mo,0)).getUTCDate())}` };

function hubRange(){
  const today=todayStr();
  if(HUB.mode==='custom'&&HUB.from&&HUB.to){ const a=HUB.from<=HUB.to?HUB.from:HUB.to, b=HUB.from<=HUB.to?HUB.to:HUB.from; return {from:a,to:b,label:`${dLabel(a)} – ${dLabel(b)}`} }
  if(HUB.mode==='all'){ let a=null;
    for(const d of Object.values(LG.days)) if(d.date&&(!a||d.date<a)) a=d.date;
    for(const c of Object.values(LG.cases)) if(c.date&&(!a||c.date<a)) a=c.date;
    for(const c of (H.list||[])){ const f=c.summary&&c.summary.from&&String(c.summary.from).slice(0,10); if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f)&&(!a||f<a)) a=f }
    a=a||today; return {from:a,to:today,label:`All time (${dLabel(a)} – ${dLabel(today)})`} }
  if(!HUB.month) HUB.month=today.slice(0,7);
  return {from:`${HUB.month}-01`,to:lastDay(HUB.month),label:monthLabel(HUB.month)};
}
function hubDays(from,to){ const out=[]; const end=to>todayStr()?todayStr():to; for(let d=from; d<=end; d=addDays(d,1)) out.push(d); return out }

/* archive comparisons that are not already the source of a ledger day (September's imported Dhub days point at theirs) */
function hubArchive(from,to){
  const refs=new Set(Object.values(LG.days).map(d=>d.archiveRef).filter(Boolean));
  const list=(H.list||[]).filter(c=>!refs.has(c.id)), A={comps:0,refsSkipped:(H.list||[]).length-list.length,n:0,d:0,h:0,daily:{},undated:0};
  for(const c of list){ const s=c.summary||{}; let hit=false;
    if(s.daily){ for(const [k,v] of Object.entries(s.daily)) if(k>=from&&k<=to){ hit=true; A.n+=v.n; A.d+=v.d; A.h+=v.h; const x=A.daily[k]||(A.daily[k]={n:0,d:0}); x.n+=v.n; x.d+=v.d } }
    else if(s.from&&s.to&&s.from.slice(0,10)<=to&&s.to.slice(0,10)>=from){ hit=true; A.undated++ }
    if(hit) A.comps++ }
  return A;
}

function hubData(){
  const R=hubRange(), days=hubDays(R.from,R.to), today=todayStr();
  const L=LEDGERS.map(l=>{ const k=l.k, P=PN(k), cases=allCases(k), st=acctStart(k);
    const o={k,l,P,name:lgName(k),payout:isPayout(k),color:(HUB_SERIES.find(s=>s.k===k)||{}).c,dpN:0,dpV:0,prN:0,prV:0,daysRec:0,late:0,daily:{},fees:{},settle:null,
      neu:0,res:0,open:[],openAmt:0,start:st};
    for(const d of days){ const day=LG.days[dayId(k,d)], t=day&&day.totals;
      if(t){ o.dpN+=t.dpN||0; o.dpV+=t.dpV||0; o.prN+=t.jcN||0; o.prV+=t.jcV||0; o.daysRec++; o.daily[d]={dpV:t.dpV||0,prV:t.jcV||0,dpN:t.dpN||0,prN:t.jcN||0};
        if(t.fees) for(const [f,v] of Object.entries(t.fees)) o.fees[f]=(o.fees[f]||0)+v;
        if(day.settleTotals){ o.settle=o.settle||{n:0,gross:0,net:0}; o.settle.n+=day.settleTotals.n; o.settle.gross+=day.settleTotals.gross; o.settle.net+=day.settleTotals.net } }
      if(st&&d>=st&&d<=today) for(const s of sessKeys(k)) if(sessionState(day,s,k,d)==='late') o.late++ }
    for(const c of cases){ if(c.date>=R.from&&c.date<=R.to) o.neu++; { const rd=resDay(c); if(rd&&rd>=R.from&&rd<=R.to) o.res++ } if(c.st!=='res'){ o.open.push(c); o.openAmt+=c.a||0 } }
    o.newByDay={}; for(const c of cases) if(c.date>=R.from&&c.date<=R.to) o.newByDay[c.date]=(o.newByDay[c.date]||0)+1;
    o.oldest=o.open.reduce((m,c)=>Math.max(m,ageDays(c)),0);
    o.expected=st? days.filter(d=>d>=st).length : 0;
    return o });
  const critical=[]; for(const o of L) for(const c of o.open){
    const why= o.payout&&c.t==='DP_NOT_SUCCESS'? `Paid by ${o.P}, Dpaisa declined`
      : STL_TYPES.has(c.t)&&c.stl&&c.stl.st==='settled'? `${o.P} settled it, Dpaisa ${c.t==='NOT_IN_DP'?'has no record':'not approved'}`
      : c.t==='AMOUNT_DIFF'? 'Amounts differ' : c.t==='SETTLE_AMT'? 'Settled amount differs' : null;
    if(why) critical.push({...c,why,o}) }
  critical.sort((a,b)=>(b.a||0)-(a.a||0));
  return {R,days,L,A:hubArchive(R.from,R.to),critical};
}

  const mv=n=>{ const [y,mo]=HUB.month.split('-').map(Number); HUB.month=new Date(Date.UTC(y,mo-1+n,1)).toISOString().slice(0,7); renderHub(m) };

function renderHubBody(){
  const el=$('#hubBody'); if(!el) return;

  if(H.db===undefined){ el.innerHTML='<section class="panel"><div class="panel-b row"><span class="spin"></span><span class="faint">Loading…</span></div></section>'; return }
  const D=hubData(), {L,A,R}=D, pin=L.filter(o=>!o.payout), pout=L.filter(o=>o.payout);

      <td class="num ${dn||dv?'neg':''}">${dn?fmtInt(dn)+' txns':'-'}${dv?`<div style="font-size:11.5px">PKR ${pk(dv)}</div>`:''}</td>
      <td class="num">${fmtInt(o.neu)}</td><td class="num">${fmtInt(o.res)}</td><td class="num"><b>${fmtInt(o.open.length)}</b></td><td class="num">${pk(o.openAmt)}</td><td class="num">${o.open.length?o.oldest+'d':'-'}</td></tr>` };
  const grp=t=>`<tr><td colspan="11" class="eyebrow" style="background:var(--surface-2);padding:6px 10px">${t}</td></tr>`;
  const types=[...new Set(L.flatMap(o=>o.open.map(c=>c.t)))];
  const bk=[['0–1 d',0,1,'var(--q1)'],['2–3 d',2,3,'var(--q2)'],['4–7 d',4,7,'var(--q3)'],['> 7 d',8,1e9,'var(--q4)']];
  el.innerHTML=`<div class="stack">
    <div class="kpis" style="grid-template-columns:repeat(6,minmax(0,1fr))">
      ${kpi('Payins · Dpaisa successful',fmtInt(sum(pin,'dpN')),`PKR ${pk(pinV)}`)}
      ${kpi('Payouts · Dpaisa approved',fmtInt(sum(pout,'dpN')),`PKR ${pk(poutV)}`)}
      ${kpi('Net flow (payins − payouts)',`<span class="${pinV-poutV<0?'neg':''}">PKR ${kfmt((pinV-poutV)/1e6)}</span>`,`PKR ${pk(pinV-poutV)}`)}
      ${kpi('Unreconciled difference',`${fmtInt(diffN)} txns`,`PKR ${pk(diffAbs)} · sum across ledgers`,diffN||diffAbs)}
      ${kpi('Open items now',fmtInt(openN),`PKR ${pk(openAmt)} · <button class="link" data-step="cases">review</button>`,openN>0)}
      ${kpi('Critical items',`<span class="${D.critical.length?'neg':''}">${fmtInt(D.critical.length)}</span>`,`PKR ${pk(critAmt)}`,D.critical.length>0)}
    </div>
    ${late?`<div class="notice warn">${fmtInt(late)} session${late>1?'s are':' is'} past due in ${esc(R.label)} — see the ledger rows marked below.</div>`:''}
    <section class="panel"><div class="panel-h"><h2>Ledgers · ${esc(R.label)}</h2><span class="faint" style="font-size:12.5px">Successful payins / approved payouts. Difference = Dpaisa − provider. Click a row to open its ledger.</span></div>
      <div class="scroll-x"><table class="t res"><thead><tr><th>Ledger</th><th class="num">Days done</th><th class="num">Past due</th><th class="num">Dpaisa</th><th class="num">Provider</th><th class="num">Difference</th><th class="num">New items</th><th class="num">Resolved</th><th class="num">Open now</th><th class="num">Open PKR</th><th class="num">Oldest</th></tr></thead><tbody>
        ${grp('Payins')}${pin.map(row).join('')}${grp('Payouts')}${pout.map(row).join('')}
      </tbody></table></div>
      <div class="panel-b row" data-harch="1" style="border-top:1px solid var(--line);gap:10px;cursor:pointer;font-size:12.5px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${HUB_ARCH_C}"></span><b>Archive</b><span class="faint" style="flex:1;min-width:240px">${A.comps?`${fmtInt(A.comps)} comparison${A.comps>1?'s':''} with transactions in this period · <b style="color:var(--ink)">${fmtInt(A.n)}</b> lines, <b style="color:var(--ink)">${fmtInt(A.d)}</b> discrepancies${A.h?` (${fmtInt(A.h)} high)`:''}${A.undated?` · ${A.undated} without a daily breakdown`:''}`:'No archived comparisons cover this period.'}${A.refsSkipped?` · ${A.refsSkipped} already counted in the Dhub · JC ledger (imported days)`:''}</span><span class="link">Archive summary →</span></div></section>
    <div class="grid-2">
      <section class="panel"><div class="panel-h"><h2>Daily volume · Dpaisa side</h2><span class="spacer"></span><div class="legend"><span><i style="background:var(--s1)"></i>Payins</span><span><i style="background:var(--s2)"></i>Payouts</span></div></div><div class="panel-b"><div id="hVol"></div></div></section>
      <section class="panel"><div class="panel-h"><h2>Daily difference by ledger</h2><span class="faint" style="font-size:12px">|Dpaisa − provider|, PKR</span><span class="spacer"></span><div class="legend">${L.map(o=>`<span><i style="background:${o.color}"></i>${esc(o.l.acct==='dhub'?'Dhub':'Dpaisa')} · ${esc(o.P)}${o.payout?' out':''}</span>`).join('')}</div></div><div class="panel-b"><div id="hDiff"></div></div></section>
    </div>
    <section class="panel"><div class="panel-h"><h2>Issues found per day</h2><span class="faint" style="font-size:12px">New open items per ledger, plus discrepancies in archived comparisons</span><span class="spacer"></span><div class="legend">${L.map(o=>`<span><i style="background:${o.color}"></i>${esc(o.name)}</span>`).join('')}<span><i style="background:${HUB_ARCH_C}"></i>Archive</span></div></div><div class="panel-b"><div id="hIss"></div></div></section>
    <div class="grid-2">
      <section class="panel"><div class="panel-h"><h2>Open items by type</h2><span class="faint" style="font-size:12px">now · count (PKR)</span></div>
        ${types.length?`<div class="scroll-x"><table class="t res"><thead><tr><th>Type</th>${L.map(o=>`<th class="num">${esc(o.l.acct==='dhub'?'Dhub':'Dpaisa')} · ${esc(o.P)}${o.payout?' out':''}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
          ${types.map(t=>{ const cells=L.map(o=>{ const x=o.open.filter(c=>c.t===t); return {n:x.length,a:x.reduce((s,c)=>s+(c.a||0),0),o} }); const tn=cells.reduce((s,c)=>s+c.n,0), ta=cells.reduce((s,c)=>s+c.a,0);
            return `<tr><td data-tip="${esc(CASE_TYPES[t]?CASE_TYPES[t].label('the provider',false):t)}">${esc(HUB_TYPE[t]||t)}</td>${cells.map(c=>c.n?`<td class="num" data-tip="${esc(ctLabel(t,c.o.k))}<br>${fmtInt(c.n)} · PKR ${pk(c.a)}"><button class="link" data-hcase="${c.o.k}:${t}">${fmtInt(c.n)}</button><div class="faint" style="font-size:11px">${kfmt(c.a/1e6)}</div></td>`:'<td class="num faint">-</td>').join('')}<td class="num"><b>${fmtInt(tn)}</b><div class="faint" style="font-size:11px">${kfmt(ta/1e6)}</div></td></tr>` }).join('')}
          </tbody></table></div>`:'<div class="panel-b faint" style="text-align:center;padding:24px">No open items.</div>'}</section>
      <section class="panel"><div class="panel-h"><h2>Age of open items</h2><span class="spacer"></span><div class="legend">${bk.map(b=>`<span><i style="background:${b[3]}"></i>${b[0]}</span>`).join('')}</div></div><div class="panel-b stack" style="gap:12px">
        ${L.map(o=>{ const tot=o.open.length; const parts=bk.map(b=>({b,n:o.open.filter(c=>{const a=ageDays(c); return a>=b[1]&&a<=b[2]}).length}));
          return `<div><div class="row" style="justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span>${esc(o.name)}</span><span class="mono faint">${fmtInt(tot)}</span></div>
            <div style="display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)">${tot?parts.filter(p=>p.n).map(p=>`<i style="flex:${p.n};background:${p.b[3]};min-width:3px" data-tip="${esc(o.name)} · ${p.b[0]}<br><b>${fmtInt(p.n)}</b> items (${(p.n/tot*100).toFixed(0)}%)"></i>`).join(''):''}</div></div>` }).join('')}
      </div></section>
    </div>
    <section class="panel"><div class="panel-h"><h2>Critical items</h2><span class="faint" style="font-size:12px">Paid-but-declined payouts, EP-settled transactions Dpaisa doesn’t have as approved, and amount differences · largest first</span></div>
      ${D.critical.length?`<div class="scroll-x" style="max-height:420px;overflow:auto"><table class="t res"><thead><tr><th>Ledger</th><th>Raised</th><th>Transaction ID</th><th>Why it matters</th><th class="num">Amount</th><th class="num">Age</th></tr></thead><tbody>
        ${D.critical.slice(0,50).map(c=>`<tr class="sev-HIGH" data-hl-cases="${c.o.k}" style="cursor:pointer"><td>${esc(c.o.name)}</td><td class="mono">${dLabel(c.date)}</td><td class="mono">${esc(c.id)}${c.alt?`<div class="faint" style="font-size:11px">Dpaisa ${esc(c.alt)}</div>`:''}</td><td>${esc(c.why)}</td><td class="num">${pk(c.a||0)}</td><td class="num">${ageDays(c)}d</td></tr>`).join('')}
      </tbody></table></div>${D.critical.length>50?`<p class="faint" style="font-size:12px;padding:8px 16px">Showing the 50 largest of ${fmtInt(D.critical.length)}.</p>`:''}`:'<div class="panel-b faint" style="text-align:center;padding:24px">No critical items open.</div>'}</section>
  </div>`;
  el.querySelectorAll('[data-hl]').forEach(r=>{ const go=()=>{ LG.acct=r.dataset.hl; LG.month=HUB.mode==='month'?HUB.month:null; setAccount(LGR(LG.acct).acct); S.step='ledger'; render() }; r.onclick=go; r.onkeydown=e=>{ if(e.key==='Enter') go() } });
  el.querySelectorAll('[data-hl-cases]').forEach(r=>r.onclick=()=>{ LG.acct=r.dataset.hlCases; LG.cf={q:'',type:'',age:'',show:'open'}; S.step='cases'; render() });
  el.querySelectorAll('[data-hcase]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [k,t]=b.dataset.hcase.split(':'); LG.acct=k; LG.cf={q:'',type:t,age:'',show:'open'}; S.step='cases'; render() });
  const ar=el.querySelector('[data-harch]'); if(ar) ar.onclick=()=>{ S.step='overview'; render() };
  HUB.last=D; drawHubCharts();
}

function drawHubCharts(){
  const D=HUB.last; if(!D) return; const days=D.days, L=D.L;
  // a day only has a value when at least one ledger of that kind was reconciled — no fake zeros
  const volOf=po=>Object.fromEntries(days.filter(d=>L.some(o=>o.payout===po&&o.daily[d])).map(d=>[d,L.filter(o=>o.payout===po).reduce((s,o)=>s+((o.daily[d]||{}).dpV||0),0)/1e6]));
  const vol=[{name:'Payins',c:'var(--s1)',v:volOf(false)},{name:'Payouts',c:'var(--s2)',v:volOf(true)}];
  hubLines($('#hVol'),days,vol,v=>'PKR '+Number(v).toLocaleString('en-US',{maximumFractionDigits:0}));
  hubBars($('#hDiff'),days,L.map(o=>({name:o.name,c:o.color,v:Object.fromEntries(days.map(d=>{ const x=o.daily[d]; return [d,x?Math.abs(x.dpV-x.prV)/1e6:0] })),sv:Object.fromEntries(days.map(d=>{ const x=o.daily[d]; return [d,x?`${fmtInt(x.dpN-x.prN)} txns · PKR ${pk(x.dpV-x.prV)}`:''] }))})),v=>'PKR '+Number(v).toLocaleString('en-US',{maximumFractionDigits:0}),'Difference');
  hubBars($('#hIss'),days,[...L.map(o=>({name:o.name,c:o.color,v:o.newByDay})),{name:'Archive discrepancies',c:HUB_ARCH_C,v:Object.fromEntries(Object.entries(D.A.daily).map(([k,x])=>[k,x.d]))}],v=>fmtInt(v),'Issues');
}
const dlab=k=>`${+k.slice(8,10)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+k.slice(5,7)-1]}`;
function hubAxes(W,H,ml,mr,mt,mb,top,step,y){ let s=''; for(let v=0;v<=top+1e-9;v+=step) s+=`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${ml-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${kfmt(v)}</text>`; return s }
function hubBars(el,days,series,fmt,what){
  if(!el) return; if(!days.length){ el.innerHTML='<p class="faint" style="padding:36px 0;text-align:center">Nothing in this period yet.</p>'; return }
  const W=el.clientWidth||600, H=210, ml=46, mr=8, mt=10, mb=26, iw=W-ml-mr, ih=H-mt-mb;
  const tot=d=>series.reduce((s,x)=>s+(x.v[d]||0),0), max=Math.max(0,...days.map(tot));
  if(!max){ el.innerHTML=`<p class="faint" style="padding:36px 0;text-align:center">No ${what.toLowerCase()} in this period.</p>`; return }
  const step=niceStep(max/4), top=Math.ceil(max/step)*step, y=v=>mt+ih-(v/top)*ih, bw=iw/days.length, w=Math.min(40,Math.max(2,bw-2)), every=Math.max(1,Math.ceil(days.length/(W/58)));
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(what)} per day">`+hubAxes(W,H,ml,mr,mt,mb,top,step,y);
  days.forEach((d,i)=>{ const x=ml+i*bw+(bw-w)/2; let acc=0; const segs=series.filter(sr=>(sr.v[d]||0)>0);
    segs.forEach((sr,j)=>{ const v=sr.v[d], y0=y(acc), y1=y(acc+v); acc+=v; const last=j===segs.length-1;
      s+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(1,y0-y1-(j>0?2:0))}" ${last?`rx="${Math.min(3,w/2)}"`:''} fill="${sr.c}"/>` });
    const tip=`${dlab(d)} ${d.slice(0,4)}<br>`+(segs.length?segs.map(sr=>`${esc(sr.name)}: <b>${fmt(sr.v[d])}</b>${sr.sv&&sr.sv[d]?` (${esc(sr.sv[d])})`:''}`).join('<br>'):`No ${what.toLowerCase()}`);
    s+=`<rect class="hit" x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${tip}"/>`;
    if(i%every===0) s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${dlab(d)}</text>` });
  el.innerHTML=s+`<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="var(--line-strong)"/></svg>`;
}
function hubLines(el,days,series,fmt){
  if(!el) return; if(!days.length){ el.innerHTML='<p class="faint" style="padding:36px 0;text-align:center">Nothing in this period yet.</p>'; return }
  const W=el.clientWidth||600, H=210, ml=46, mr=10, mt=12, mb=26, iw=W-ml-mr, ih=H-mt-mb;
  const max=Math.max(0,...series.flatMap(sr=>Object.values(sr.v)));
  if(!max){ el.innerHTML='<p class="faint" style="padding:36px 0;text-align:center">No reconciled volume in this period.</p>'; return }
  const step=niceStep(max/4), top=Math.ceil(max/step)*step, y=v=>mt+ih-(v/top)*ih, xs=i=>ml+(days.length===1?iw/2:i*iw/(days.length-1)), every=Math.max(1,Math.ceil(days.length/(W/58)));
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Daily volume">`+hubAxes(W,H,ml,mr,mt,mb,top,step,y);
  for(const sr of series){ let dpath='', run=[]; const flush=()=>{ if(run.length===1) s+=`<circle cx="${xs(run[0]).toFixed(1)}" cy="${y(sr.v[days[run[0]]]).toFixed(1)}" r="4" fill="${sr.c}" stroke="var(--surface)" stroke-width="2"/>`; else if(run.length) dpath+='M'+run.map(i=>`${xs(i).toFixed(1)},${y(sr.v[days[i]]).toFixed(1)}`).join('L'); run=[] };
    days.forEach((d,i)=>{ if(sr.v[d]===undefined) flush(); else run.push(i) }); const lastRun=run.slice(); flush();
    if(dpath) s+=`<path d="${dpath}" fill="none" stroke="${sr.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(lastRun.length>1){ const li=lastRun[lastRun.length-1]; s+=`<circle cx="${xs(li)}" cy="${y(sr.v[days[li]])}" r="4" fill="${sr.c}" stroke="var(--surface)" stroke-width="2"/>` } }
  days.forEach((d,i)=>{ const x0=days.length===1?ml:xs(i)-iw/(days.length-1)/2;
    s+=`<rect class="hit" x="${Math.max(ml,x0)}" y="${mt}" width="${days.length===1?iw:iw/(days.length-1)}" height="${ih}" fill="transparent" data-tip="${dlab(d)} ${d.slice(0,4)}<br>${series.map(sr=>`${esc(sr.name)}: <b>${sr.v[d]===undefined?'not reconciled':fmt(sr.v[d])}</b>`).join('<br>')}"/>`;
    if(i%every===0) s+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${dlab(d)}</text>` });
  el.innerHTML=s+`<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" stroke="var(--line-strong)"/></svg>`;
}
window.addEventListener('resize',debounce(()=>{ if(S.step==='hub') drawHubCharts() },150));

S.step='hub';
render();

</script>
</body></html>
